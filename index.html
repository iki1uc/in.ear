.radar-disc {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 9999px;
  border: 2px solid var(--cyan);
  background: radial-gradient(circle at 50% 50%, rgba(121,216,220,.12) 0%, rgba(121,216,220,.05) 40%, rgba(8,13,19,.9) 100%);
  overflow: hidden;
}

.radar-ring {
  position: absolute;
  border: 1px dashed rgba(121,216,220,.45);
  border-radius: 9999px;
}

.radar-sweep {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background: conic-gradient(from 0deg, rgba(0,255,136,.38) 0deg, rgba(0,255,136,.12) 45deg, transparent 70deg);
  animation: radarSweep 4s linear infinite;
}

@keyframes radarSweep {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

@keyframes radarBlink {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

.radar-dot {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 9999px;
  border: 2px solid #04120b;
  transform: translate(-50%, -50%);
  animation: radarBlink 2.4s ease-in-out infinite;
}

@keyframes whirlSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

@keyframes windBlow {
  0% {
    transform: translateX(-6px);
    opacity: .25;
  }

  50% {
    transform: translateX(6px);
    opacity: 1;
  }

  100% {
    transform: translateX(-6px);
    opacity: .25;
  }
}

.whirlwind-swirl {
  animation: whirlSpin 1.1s linear infinite;
}

.whirlwind-rotor {
  transition: transform 650ms cubic-bezier(.2,.8,.2,1);
}

.whirlwind-wind {
  animation: windBlow 1.4s ease-in-out infinite;
}

@keyframes gpuPulse {
  0% {
    box-shadow: 0 0 0px rgba(0,255,136,.0);
  }

  50% {
    box-shadow: 0 0 18px rgba(0,255,136,.55);
  }

  100% {
    box-shadow: 0 0 0px rgba(0,255,136,.0);
  }
}

.gpu-live {
  animation: gpuPulse 1.6s ease-in-out infinite;
}

@keyframes rollBallSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }
}

.roll-ball-spinning {
  animation: rollBallSpin 1.4s linear infinite;
}

@keyframes schockPulse {
  0% {
    box-shadow: 0 0 0px rgba(231,199,122,0);
  }

  50% {
    box-shadow: 0 0 22px rgba(231,199,122,.7);
  }

  100% {
    box-shadow: 0 0 0px rgba(231,199,122,0);
  }
}

.schock-pulse {
  animation: schockPulse 0.9s ease-in-out 1;
}

@keyframes tauchenRinge {
  0% {
    transform: translate(-50%, -50%) scale(1.25);
    opacity: .7;
  }

  100% {
    transform: translate(-50%, -50%) scale(0.35);
    opacity: .15;
  }
}

.tauchen-ring {
  animation: tauchenRinge 2.6s ease-in-out infinite;
}

@keyframes tauchenBlase {
  0% {
    transform: translateY(0);
    opacity: 0;
  }

  20% {
    opacity: .9;
  }

  100% {
    transform: translateY(-46px);
    opacity: 0;
  }
}

.tauchen-blase {
  animation: tauchenBlase 2.2s ease-in infinite;
}

.tauchen-kugel {
  transition: top 750ms cubic-bezier(.2,.8,.2,1), left 750ms cubic-bezier(.2,.8,.2,1);
}

.ramdisk-ball {
  width: 148px;

    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

.ramdisk-ball-spinning {

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;

.root-index .event code {
  color: #75c9ed;
  font-size: 11px;
}

.root-index .module-count {
  color: #76e8b2;
  font-size: 10px;
  letter-spacing: .08em;
}

.root-index .module-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.root-index .module {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  border: 1px solid #202938;
  border-radius: 9px;
  font-size: 12px;
}

.root-index .grid81 {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 5px;
  margin-top: 18px;
}

.root-index .grid-cell {
  display: grid;
  place-items: center;
  aspect-ratio: 1;
  background: #151c28;
  border-radius: 5px;
  color: #9daabd;
  font-size: 11px;
}

.root-index .center-cell {
  color: #07110c;
  background: #65f0b0;
  font-weight: 800;
}

.root-index .search-label {
  display: grid;
  gap: 8px;
  color: #9ba8bb;
  font-size: 12px;
  margin: 12px 0 20px;
}

.root-index .search-label input, .root-index .search-label select {
  padding: 12px;
  border: 1px solid #283346;
  border-radius: 8px;
  color: #e8edf7;
  background: #090d15;
}

.root-index .pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 18px;
  color: #8c98aa;
  font-size: 12px;
  flex-wrap: wrap;
  gap: 8px;
}

.root-index .pagination button {
  padding: 9px 12px;
  color: #aab5c6;
  background: #151c28;
  border: 1px solid #283346;
  border-radius: 7px;
}

.root-index .mobile-nav {
  display: none;
}

.root-index .nav-button {
  padding: 12px 14px;
  border-radius: 8px;
}

.root-index .panel-heading {
  flex-wrap: wrap;
}

@media (max-width: 700px) {
  .root-index .panel-heading {
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }

  .root-index .search-label {
    grid-template-columns: 1fr !important;
  }

  .root-index .event {
    grid-template-columns: 9px 1fr;
  }

  .root-index .event time {
    grid-column: 2;
  }

  .root-index .topbar {
    height: 58px;
    padding: 0 5vw;
  }

  .root-index .topbar small {
    font-size: 9px;
  }

  .root-index .desktop-nav {
    display: none;
  }

  .root-index .ri-main {
    width: 90vw;
    margin: 28px auto;
  }

  .root-index .stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .root-index .stat-card {
    min-height: 112px;
    padding: 14px;
  }

  .root-index .stat-value {
    font-size: 24px;
  }

  .root-index .panel {
    padding: 16px;
  }

  .root-index .event {
    grid-template-columns: 9px 1fr auto;
    gap: 10px;
  }

  .root-index .event code {
    display: none;
  }

  .root-index .event time {
    font-size: 10px;
  }

  .root-index .module-list {
    grid-template-columns: 1fr;
  }

  .root-index .grid81 {
    gap: 3px;
  }

  .root-index .grid-cell {
    font-size: 9px;
  }

  .root-index .mobile-nav {
    position: fixed;
    z-index: 5;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: space-around;
    padding: 8px 4px max(8px, env(safe-area-inset-bottom));
    background: #0b0f18;
    border-top: 1px solid #202938;
  }

  .root-index .mobile-nav-item {
    display: grid;
    justify-items: center;
    gap: 3px;
    min-width: 60px;
    padding: 4px;
    color: #8491a5;
    background: transparent;
    border: 0;
    font-size: 10px;
  }

  .root-index .mobile-nav-item span {
    font-size: 19px;
  }

  .root-index .mobile-nav-item.active {
    color: #70eab0;
  }
}
