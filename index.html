  --gold: #e8b64c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #03050c;
    --panel: #080d17;
    --line: #243a2e;
    --text: #e8ecf1;
    --muted: #8da294;
    --green: #4ade80;
    --gold: #e8b64c;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.index {
  width: min(100% - 28px, 720px);
  margin: 0 auto;
  padding: 24px 0 48px;
}

.eyebrow {
  color: var(--green);
  font: 11px/1.4 ui-monospace, monospace;
  letter-spacing: .18em;
  text-transform: uppercase;
}

.index h1 {
  margin: 8px 0 6px;
  color: var(--gold);
  font: 700 clamp(30px, 9vw, 52px)/1 Georgia, serif;
  letter-spacing: -.04em;
  overflow-wrap: anywhere;
}

.intro {
  color: var(--muted);
  margin: 0 0 24px;
  font-size: 13px;
}

.index nav {
  display: grid;
  gap: 10px;
}

.index nav a {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 58px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
  -webkit-tap-highlight-color: transparent;
}

.index nav a:active {
  border-color: var(--green);
  background: #0f2216;
}

.index nav a:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

.index nav strong {
  font-size: 15px;
}

.index nav span {
  color: var(--muted);
  font: 12px ui-monospace, monospace;
  white-space: nowrap;
}

.index footer {
  margin-top: 24px;
  color: var(--muted);
  font: 11px/1.6 ui-monospace, monospace;
}

.targets {
  margin-top: 40px;
  display: grid;
  gap: 10px;
}

.targets section {
  min-height: 58px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel);
}

.targets h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.targets p {
  margin: 4px 0 0;
  color: var(--muted);
  font: 12px/1.6 ui-monospace, monospace;
}

@media (prefers-reduced-motion: no-preference) {
  .index nav a {
    transition: border-color .15s, background .15s;
  }
}
