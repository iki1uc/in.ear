:root{
  --bg:#0a0a0e;
  --surface:#121218;
  --surface2:#1a1a24;
  --line:#2a2a38;
  --text:#f2f0e8;
  --muted:#9a97a8;
  --gold:#f2c94c;
  --green:#3ddc84;
  --blue:#4ea8ff;
  --red:#ff5a4e;
  --orange:#ff8a2a;
  --purple:#b388ff;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#0a0a0e;
    --surface:#121218;
    --surface2:#1a1a24;
    --line:#2a2a38;
    --text:#f2f0e8;
    --muted:#9a97a8;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text)
}

body{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  overflow-x:clip
}

button,input,textarea,select{
  font:inherit
}

.btn{
  min-height:44px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface2);
  color:var(--text);
  padding:10px 14px;
  font-weight:800;
  letter-spacing:.02em;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px
}

.btn:active{
  transform:translateY(1px)
}

.btn:disabled{
  opacity:.42;
  cursor:not-allowed
}

.btn-gold{
  background:var(--gold);
  color:#141310;
  border-color:var(--gold)
}

.btn-green{
  background:#123324;
  color:#bff5d6;
  border-color:#2a6b4a
}

.btn-red{
  background:#3a1512;
  color:#ffd1cc;
  border-color:#7a2a22
}

.btn-blue{
  background:#122a44;
  color:#cde6ff;
  border-color:#2a5a8a
}

.btn-purple{
  background:#241a3a;
  color:#e2d5ff;
  border-color:#5a3fa8
}

.chip{
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  font-weight:800
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px
}

.input{
  width:100%;
  min-height:44px;
  background:#0d0d13;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  padding:10px 12px;
  outline:none
}

.textarea{
  width:100%;
  background:#0d0d13;
  border:1px solid var(--line);
  border-radius:10px;
  color:var(--text);
  padding:12px;
  outline:none;
  overflow-wrap:anywhere
}

.tabbtn{
  min-height:52px;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.06em;
  color:var(--muted);
  background:transparent;
  border:0;
  cursor:pointer
}

.tabbtn.active{
  color:var(--text)
}

.nocap{
  overflow-wrap:anywhere
}

@media (min-width: 640px) {
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
}
