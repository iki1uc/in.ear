<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NC · Mobile Index — 94 Knoten</title>
<link rel="icon" href="icon.ico">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root {
    --line: #263342;
    --panel: #0b1220;
    --muted: #8da294;
    --gold: #e8b64c;
    --green: #4ade80;
    --safe-area-inset-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: #e8eef2;
    background: #050912;
    font-family: system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  .eyebrow { color: var(--green); font: 11px/1.4 ui-monospace, monospace; letter-spacing: .18em; text-transform: uppercase; }
  .index h1 { margin: 8px 0 6px; color: var(--gold); font: 700 clamp(28px, 8vw, 48px)/1 Georgia, serif; letter-spacing: -.03em; }
  .intro { color: var(--muted); margin: 0 0 18px; font-size: 13px; }
</style>
</head>
<body>
  <main class="index">
    <header>
      <p class="eyebrow">NC · Mobile Index</p>
      <h1>729 → 243 → 81 → 27 → 9 → 3 → 1</h1>
      <p class="intro">Interaktive Canvas-Übersicht · 94 Knoten</p>
    </header>

    <section class="canvas-card" aria-label="Interaktive Knotenübersicht">
      <canvas id="indexCanvas" aria-label="94 Knoten in konzentrischen Ebenen"></canvas>
      <p class="canvas-hint">Antippen oder klicken, um einen Knoten auszuwählen.</p>
    </section>

    <section class="selected-card" aria-live="polite">
      <span class="eyebrow">AUSGEWÄHLTER KNOTEN</span>
      <strong id="selectedNode">NC · ROOT</strong>
    </section>

    <nav class="node-grid" id="nodeGrid" aria-label="Alle Indexknoten"></nav>

    <footer>1 Root + 3 Achsen + 9 Kerne + 81 Zellen = 94 Knoten</footer>
  </main>

  <style>
    .index {
      width: min(100% - 28px, 720px);
      margin: 0 auto;
      padding: calc(20px + var(--safe-area-inset-top, 0px)) 0 max(36px, env(safe-area-inset-bottom));
    }
    .index-card,
    .canvas-card,
    .selected-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }
    .canvas-card { padding: 12px; }
    #indexCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 100 / 82;
      border: 1px solid #4ade8033;
      border-radius: 10px;
      background: #050912;
      touch-action: manipulation;
    }
    .canvas-hint { margin: 9px 2px 0; color: var(--muted); font-size: 11px; }
    .selected-card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 10px;
      padding: 12px 14px;
    }
    .selected-card strong { color: var(--gold); font: 600 15px ui-monospace, monospace; }
    .node-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .node-grid a {
      min-width: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      font: 11px ui-monospace, monospace;
    }
    .node-grid a span:last-child { color: var(--muted); }
    .node-grid a[aria-current="true"] { border-color: var(--green); color: var(--green); }
    .index footer { margin-top: 18px; color: var(--muted); font: 11px/1.6 ui-monospace, monospace; }
    @media (min-width: 480px) {
      .node-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }
  </style>

  <script>
    (() => {
      const canvas = document.getElementById("indexCanvas");
      const ctx = canvas.getContext("2d");
      const grid = document.getElementById("nodeGrid");
      const selected = document.getElementById("selectedNode");
      const nodes = [{ label: "NC", type: "ROOT", ring: 0 }];
      ["BIO", "BIOS", "BIOS.EN"].forEach((label, i) => {
        nodes.push({ label, type: "ACHSE", ring: 1, slot: i });
      });
      for (let i = 1; i <= 9; i++) {
        nodes.push({ label: `K${String(i).padStart(2, "0")}`, type: "KERN", ring: 2, slot: i - 1 });
      }
      for (let i = 1; i <= 81; i++) {
        nodes.push({ label: `N${String(i).padStart(2, "0")}`, type: "ZELLE", ring: 3, slot: i - 1 });
      }
      let activeIndex = 0;
      let hitTargets = [];
      function selectNode(index) {
        activeIndex = index;
        const node = nodes[index];
        selected.textContent = `${node.label} · ${node.type}`;
        grid.querySelectorAll("a").forEach((link, i) => {
          if (i === index) link.setAttribute("aria-current", "true");
          else link.removeAttribute("aria-current");
        });
        draw();
      }
      nodes.forEach((node, index) => {
        const link = document.createElement("a");
        link.href = `#node-${index + 1}`;
        link.innerHTML = `<span>${node.label}</span><span>${String(index + 1).padStart(2, "0")}</span>`;
        link.addEventListener("click", event => { event.preventDefault(); selectNode(index); });
        grid.appendChild(link);
      });
      // Interne Zeichenfläche = angezeigte CSS-Größe × DPR.
      // Nur width:100% im CSS skaliert die Zeichenfläche NICHT mit.
      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const width = rect.width || 320;
        const height = Math.round(width * 0.82); // = aspect-ratio 100 / 82 aus CSS
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { width, height };
      }
      function draw() {
        const { width, height } = resizeCanvas();
        ctx.clearRect(0, 0, width, height);
        const cx = width / 2;
        const cy = height / 2;
        const radius = Math.min(width * 0.43, height * 0.43);
        const ringScales = [0, 0.34, 0.64, 0.94];
        const colors = ["#e8b64c", "#4ade80", "#33d6ff", "#b98aff"];
        hitTargets = [];
        for (let ring = 1; ring <= 3; ring++) {
          ctx.beginPath();
          ctx.arc(cx, cy, radius * ringScales[ring], 0, Math.PI * 2);
          ctx.strokeStyle = "#4ade8030";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        nodes.forEach((node, index) => {
          let x = cx, y = cy, dotRadius = 7;
          if (node.ring > 0) {
            const count = [1, 3, 9, 81][node.ring];
            const angle = (node.slot / count) * Math.PI * 2 - Math.PI / 2;
            const r = radius * ringScales[node.ring];
            x = cx + Math.cos(angle) * r;
            y = cy + Math.sin(angle) * r;
            dotRadius = node.ring === 3 ? 3 : 5;
          }
          const isActive = index === activeIndex;
          ctx.beginPath();
          ctx.arc(x, y, isActive ? dotRadius + 3 : dotRadius, 0, Math.PI * 2);
          ctx.fillStyle = colors[node.ring];
          ctx.fill();
          if (isActive) {
            ctx.beginPath();
            ctx.arc(x, y, dotRadius + 7, 0, Math.PI * 2);
            ctx.strokeStyle = colors[node.ring];
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          hitTargets.push({ x, y, radius: Math.max(dotRadius + 7, 12), index });
        });
        ctx.fillStyle = "#8da294";
        ctx.font = "11px ui-monospace, monospace";
        ctx.textAlign = "left";
        ctx.fillText("94 NODES", 10, height - 10);
      }
      function handleTap(event) {
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        let closest = null, closestDistance = Infinity;
        for (const target of hitTargets) {
          const distance = Math.hypot(x - target.x, y - target.y);
          if (distance <= target.radius && distance < closestDistance) { closest = target; closestDistance = distance; }
        }
        if (closest) selectNode(closest.index);
      }
      canvas.addEventListener("pointerup", handleTap);
      // Bei Größenänderung: Zeichenfläche neu skalieren + neu zeichnen.
      // Nur resizeCanvas() ohne draw() würde das Bild löschen.
      new ResizeObserver(() => draw()).observe(canvas);
      window.addEventListener("resize", () => draw());
      // Initial: erst skalieren, dann zeichnen (läuft über selectNode -> draw)
      resizeCanvas();
      selectNode(0);
    })();
  </script>
</body>
</html>
