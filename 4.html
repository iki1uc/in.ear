<script>

const cache=m=>m<99?{c:27,n:"GATE"}:m<243?{c:243,n:"ANALYSE"}:m<729?{c:729,n:"MEMORY"}:{c:999,n:"DU"};
function lauf(){const a=+$("raum").value,b=+$("linie").value,c=+$("richtung").value,s=a+b+c,k=cache(s);$("o1").textContent=`LAUF\n81=${a} 3=${b} 9=${c}\n81 -> 27 -> 3 -> 0\nSUMME=${s} CACHE=${k.c} ${k.n}\nEYE=sehen BRAIN=halten CORE=pruefen CROWN=vereinigen\nHALT=ZIEL`;seek("TOOLOMAT LAUF");}
function cycl(){const M=+$("m").value;$("o2").textContent=`CYC.L\nM=${M}\nLIEBE=+${M} HASS=-${M} BETRAG=${Math.abs(M)}`;seek("TOOLOMAT CYC.L");}
function wetter(){const v=[+$("atom").value,+$("wasser").value,+$("co2").value,+$("sauer").value,+$("blitz").value,+$("donner").value,+$("wolke").value,+$("atmo").value],g=+$("gate").value,sum=v.reduce((x,y)=>x+y,0),o=sum*g;$("o3").textContent=`WETTER\nSUMME=${sum.toFixed(4)} GATE=${g}\nOMEGA=SUMME x GATE=${o.toFixed(4)}\nWERT=OMEGA x 19683=${(o*19683).toFixed(2)}`;seek("TOOLOMAT WETTER");}
let PQ=[{H:34,B:4,T:62,eye:1},{H:41,B:6,T:55,eye:1},{H:38,B:5,T:71,eye:0}];
function pqRender(){$("pqRows").innerHTML=PQ.map((p,i)=>`<label>LIVE ${i+1} H <input type="number" value="${p.H}" onchange="PQ[${i}].H=+this.value"> B <input type="number" value="${p.B}" onchange="PQ[${i}].B=+this.value"> T <input type="number" value="${p.T}" onchange="PQ[${i}].T=+this.value"> EYE <button onclick="PQ[${i}].eye=PQ[${i}].eye?0:1;pqRender()">${p.eye?"OPEN":"CLOSE"}</button></label>`).join("");}
function med(a){return [...a].sort((x,y)=>x-y)[1]}
function pqCalc(){const Hs=PQ.map(p=>p.H),Bs=PQ.map(p=>p.B),Ts=PQ.map(p=>p.T);const mH=med(Hs),mB=med(Bs),mT=med(Ts);const vars=PQ.map(p=>{const h=p.H/81,b=p.B/9,t=p.T/100;return ((h-mH/81)**2+(b-mB/9)**2+(t-mT/100)**2)/3});const tot=vars.reduce((a,b)=>a+b,0)/3;const fair=Math.max(0,Math.round(100-tot*420));const open=PQ.filter(p=>p.eye).length;const bonus=open===3?1:open===2?0.8:open===1?0.5:0.2;const lvl=Math.floor(mH/81*50+mB/9*30+mT/100*20+fair/100*10);const sp=Math.floor(lvl*(fair/100)*bonus*2.5+lvl*0.3);$("pqOut").textContent=`PQ 3x\nMEDIAN H=${mH} B=${mB} T=${mT}\nFAIRNESS=${fair}% · OPEN=${open}/3 · BONUS=${bonus}\nLVL=${lvl} · SKILL=${sp}\nROOT ${fair>60&&lvl>10?"JA · FREIGABE":"NEIN · wartet"}\nPQ je LIVE: ${PQ.map(p=>(p.H*(p.B/9)*(p.T/100)).toFixed(2)).join(" · ")}`;seek("PQ 3x gerechnet");}
pqRender();
function pipe(act){let e=+$("ebene").value;const B = (
  Number($("der").value) +

) / 3;if(act==="add")e+=1;if(act==="more")e+=1;if(act==="wunder"){$("der").value=40;e=e;}e=Math.min(e,40);$("ebene").value=e;$("pipeOut").textContent=`PIPELINE 1x\nAktion: ${act.toUpperCase()}\nB=(DER+DIE+DAS)/3 = ${B.toFixed(3)}\nL=${B===1?0:1}\nEbene=${e} · HOME 40\n${B===1?"HALT=ZIEL":"HALT=OFFEN"}`;seek("PIPELINE "+act);}

/* --- 729-Canvas: State + Helpers, damit das Snippet läuft --- */
/* KANON: pos = (i-1)*81 + (j-1)*9 + (k-1) · i = außen (81er-Block), j = Zeile, k = Spalte */
const S = { pos: 40, visits: {} };
const cellOf = (pos) => ({ i: Math.floor(pos / 81) + 1, j: Math.floor((pos % 81) / 9) + 1, k: (pos % 9) + 1 });
const posOf = (i, j, k) => (i - 1) * 81 + (j - 1) * 9 + (k - 1);
const HEAT = true;
function heatColor(v){ const a = Math.min(1, v / 6); return `rgba(255,${Math.round(180 - a * 140)},40,${0.25 + a * 0.65})`; }
function go(pos, src){
  if(!Number.isInteger(pos) || pos < 0 || pos > 728) return false;
  S.pos = pos; S.visits[pos] = (S.visits[pos] || 0) + 1; drawGrid(); renderGridInfo(src); return true;
}
function renderGridInfo(src){
  const c = cellOf(S.pos);
  $("grid729Info").textContent = `Pos ${S.pos} · ${c.i}-${c.j}-${c.k} · Besuche hier: ${S.visits[S.pos]||0}` + (src ? ` · ${src}` : "");
  $("grid729Out").textContent = `729 CANVAS\nPos=${S.pos} · i-j-k=${c.i}-${c.j}-${c.k}\nHOME 40 = 1-5-5 · 360 = 5-5-1 · 364 = 5-5-5 · 728 = 9-9-9\nTippen = Sprung, k bleibt.`;
}
/* --- Dein Canvas-Snippet (unverändert, nur $ ist schon definiert) --- */
const gridCanvas = $("gridCanvas");
const gridCtx = gridCanvas.getContext("2d");
function drawGrid() {
  const dpr = window.devicePixelRatio || 1;
  const size = gridCanvas.clientWidth;
  if (!size) return;
  gridCanvas.width = Math.round(size * dpr);
  gridCanvas.height = Math.round(size * dpr);
  const g = gridCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, size, size);
  const gap = Math.max(2, size * 0.012);
  const cell = (size - gap * 10) / 9;
  const current = cellOf(S.pos);
  for (let n = 0; n < 81; n++) {
    const i = Math.floor(n / 9) + 1;
    const j = n % 9 + 1;
    const x = gap + (j - 1) * (cell + gap);
    const y = gap + (i - 1) * (cell + gap);
    const pos = posOf(i, j, current.k);
    const visits = S.visits[pos] || 0;
    const selected = i === current.i && j === current.j;
    g.fillStyle = selected ? "#fff" : HEAT && visits ? heatColor(visits) : "#101010";
    g.fillRect(x, y, cell, cell);
    g.strokeStyle = selected ? "#fff" : "#333";
    g.lineWidth = 1;
    g.strokeRect(x, y, cell, cell);
    g.fillStyle = selected ? "#000" : "#f5f5f5";
    g.font = `${Math.max(8, Math.min(13, cell * 0.24))}px Consolas, monospace`;
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText(`${i}-${j}`, x + cell / 2, y + cell / 2);
  }
}
function canvasCellFromEvent(e) {
  const rect = gridCanvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * gridCanvas.width / rect.width;
  const y = (e.clientY - rect.top) * gridCanvas.height / rect.height;
  const gap = Math.max(2, gridCanvas.clientWidth * 0.012);
  const cell = (gridCanvas.clientWidth - gap * 10) / 9;
  const scale = gridCanvas.width / gridCanvas.clientWidth;
  const col = Math.floor((x / scale - gap) / (cell + gap));
  const row = Math.floor((y / scale - gap) / (cell + gap));
  if (row < 0 || row > 8 || col < 0 || col > 8) return;
  const c = cellOf(S.pos);
  go(posOf(row + 1, col + 1, c.k), "Canvas-Zelle");
}
gridCanvas.addEventListener("click", canvasCellFromEvent);
new ResizeObserver(drawGrid).observe(gridCanvas);
window.addEventListener("resize", drawGrid);
/* Init 729: Start auf HOME 40, ohne doppeltes Zählen über go() */
S.visits[40] = 1; renderGridInfo("HOME 40"); drawGrid();

rootCalc();seek("ROOT eingelesen — nur Notwendiges genommen.");

/* --- 729-Canvas: State + Helpers, damit das Snippet läuft --- */
/* KANON: pos = (i-1)*81 + (j-1)*9 + (k-1) · i = außen (81er-Block), j = Zeile, k = Spalte */
const S = { pos: 40, visits: {} };
const cellOf = (pos) => ({ i: Math.floor(pos / 81) + 1, j: Math.floor((pos % 81) / 9) + 1, k: (pos % 9) + 1 });
const posOf = (i, j, k) => (i - 1) * 81 + (j - 1) * 9 + (k - 1);
const HEAT = true;
function heatColor(v){ const a = Math.min(1, v / 6); return `rgba(255,${Math.round(180 - a * 140)},40,${0.25 + a * 0.65})`; }
function go(pos, src){
  if(!Number.isInteger(pos) || pos < 0 || pos > 728) return false;

}
function renderGridInfo(src){
  const c = cellOf(S.pos);

const gridCanvas = $("gridCanvas");

function drawGrid() {
  const dpr = window.devicePixelRatio || 1;
  const size = gridCanvas.clientWidth;
  if (!size) return;
  gridCanvas.width = Math.round(size * dpr);
  gridCanvas.height = Math.round(size * dpr);
  const g = gridCtx;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, size, size);
  const gap = Math.max(2, size * 0.012);
  const cell = (size - gap * 10) / 9;
  const current = cellOf(S.pos);
  for (let n = 0; n < 81; n++) {
    const i = Math.floor(n / 9) + 1;
    const j = n % 9 + 1;
    const x = gap + (j - 1) * (cell + gap);
    const y = gap + (i - 1) * (cell + gap);
    const pos = posOf(i, j, current.k);
    const visits = S.visits[pos] || 0;
    const selected = i === current.i && j === current.j;
    g.fillStyle = selected ? "#fff" : HEAT && visits ? heatColor(visits) : "#101010";

  const cell = (gridCanvas.clientWidth - gap * 10) / 9;
  const scale = gridCanvas.width / gridCanvas.clientWidth;
  const col = Math.floor((x / scale - gap) / (cell + gap));
  const row = Math.floor((y / scale - gap) / (cell + gap));

  const c = cellOf(S.pos);

}

  <script>
    "use strict";
    const tabs = document.getElementById("tabs");
    const frames = [...document.querySelectorAll("iframe[data-tool]")];
    const loaded = new Set();
    function activate(name) {
      const template = document.getElementById("tpl-" + name);
      if (!template) name = "root";
      frames.forEach(frame => {
        const active = frame.dataset.tool === name;
        frame.classList.toggle("on", active);
        if (active && !loaded.has(name)) { frame.srcdoc = "<!doctype html>" + template.innerHTML; loaded.add(name); }
      });
      tabs.querySelectorAll("button[data-tool]").forEach(button => {
        const active = button.dataset.tool === name;
        button.classList.toggle("on", active);
        button.setAttribute("aria-selected", String(active));
      });
      if (location.hash !== "#" + name) { history.replaceState(null, "", "#" + name); }
    }
    tabs.addEventListener("click", event => { const button = event.target.closest("button[data-tool]"); if (button) activate(button.dataset.tool); });
    window.addEventListener("hashchange", () => { activate(location.hash.slice(1) || "root"); });
    activate(location.hash.slice(1) || "root");
  </script>
