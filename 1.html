}

:root {
  color-scheme: dark;
  --bg: #03050c;
  --panel: #05070d;
  --line: #223;
  --text: #e8ecf1;
  --muted: #8a95ab;
  --green: #4ade80;
  --gold: #ffd700;
  --cyan: #00e5ff;
  --pink: #ff00ff;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Courier New", monospace;
}

a {
  color: inherit;
}

.shell {
  width: min(100% - 24px, 860px);
  margin: 0 auto;
  padding: 16px 0 24px;
}

.top h1 {
  font-size: clamp(20px, 6vw, 28px);
  margin: 0;
}

.muted {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

.halt-line {
  font-size: 13px;
  margin: 10px 0 0;
  overflow-wrap: anywhere;
}

.halt-line strong {
  color: var(--gold);
}

.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: nowrap;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  padding-bottom: 6px;
  margin: 12px 0;
}

.tabs button {
  flex: 0 0 auto;
  min-height: 44px;
  touch-action: manipulation;
}

button {
  background: #111;
  color: var(--green);
  border: 1px solid var(--green);
  padding: 9px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
  font-family: inherit;
  min-height: 44px;
  touch-action: manipulation;
}

button.on {
  background: var(--green);
  color: #000;
}

button:disabled {
  opacity: .55;
  cursor: default;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 12px;
  border-radius: 8px;
  margin: 10px 0;
  min-width: 0;
  overflow-wrap: anywhere;
}

.card h2 {
  font-size: 15px;
  color: var(--gold);
  margin: 18px 0 6px;
  overflow-wrap: anywhere;
}

.card h2:first-child {
  margin-top: 0;
}

.card p {
  overflow-wrap: anywhere;
  line-height: 1.6;
}

.view {
  display: none;
}

.view.on {
  display: block;
}

label {
  display: block;
  margin: 8px 0;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

input {
  width: 90px;
  background: #111;
  color: var(--green);
  border: 1px solid #333;
  padding: 6px;
  max-width: 100%;
  min-height: 42px;
  font: inherit;
  font-size: 16px;
  border-radius: 6px;
}

pre {
  white-space: pre-wrap;
  background: var(--panel);
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #1a2233;
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-x: contain;
  -webkit-overflow-scrolling: touch;
  overflow-wrap: anywhere;
  font-family: inherit;
  line-height: 1.5;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 8px 0;
}

.status {
  color: var(--cyan);
  font-size: 12px;
}

footer {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 14px 0 4px;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  .shell {
    width: calc(100% - 20px);
  }

  h1 {
    font-size: 18px;
  }

  .tabs {
    margin: 10px -2px;
  }

  .tabs button {
    padding: 10px 12px;
  }

  .card {
    padding: 10px;
    margin: 8px 0;
  }

  #v-tool label,
  #v-pipe label {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 4px;
  }

  #v-tool input,
  #v-pipe input {
    width: 100%;
  }

  #pqRows label {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #223;
  }

  #pqRows input {
    width: 100%;
  }

  #pqRows button {
    min-height: 44px;
  }

  .card > button {
    margin: 3px 2px 3px 0;
  }

  pre {
    font-size: 13px;
    line-height: 1.45;
  }
}

@media (max-width: 360px) {
  .shell {
    width: calc(100% - 16px);
  }

  .tabs button {
    padding: 9px 10px;
    font-size: 12px;
  }

  #pqRows label {
    grid-template-columns: 1fr;
  }
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #03050c;
    --text: #e8ecf1;
  }
}
</style>
