  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

.\[overflow-wrap\:anywhere\] {
  overflow-wrap: anywhere;
}

:root {
  color-scheme: dark;
  --bg: #050805;
  --surface: #0b100b;
  --text: #d8f5d8;
  --muted: #9eaf9e;
  --accent: #75e675;
  --danger: #ff7272;
  --border: #293629;
  /* Legacy aliases used by the existing app — all mapped onto the new theme
     so every existing panel keeps working on the dark-green background. */
  --ink: var(--text);
  --line: var(--border);
  --surface-2: #0e160e;
  --surface-3: #152115;
  --primary: var(--accent);
  --green: var(--accent);
  --green-soft: #122a12;
  --red: var(--danger);
  --red-soft: #2a1212;
  --amber: #ffd76a;
  --amber-soft: #2a2412;
  --blue: #7ab8ff;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, sans-serif;
}

body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

button,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

a:focus-visible,
input:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.panel {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.panel-title {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
}

.btn {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
}

.btn:hover,
.btn.active {
  border-color: var(--accent);
  background: var(--accent);
  color: #071007;
}

.btn.danger {
  color: var(--danger);
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

.chip {
  padding: 3px 7px;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--muted);
  font-size: 12px;
}

/* Existing panels in the app reuse the .chip class as a container class.
   Keep those block containers rectangular (like .panel) while true inline
   chips (spans) stay pills. The theme .chip above is preserved verbatim. */

section.chip,
div.chip,
nav.chip,
aside.chip,
button.chip {
  border-radius: 8px;
}

.chip-sm {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

textarea.code {
  width: 100%;
  min-height: 220px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #070a07;
  color: var(--text);
  font: 13px/1.55 ui-monospace, monospace;
  resize: vertical;
}

.log-scroll {
  max-height: 220px;
  overflow: auto;
}

.node {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #070a07;
  color: var(--text);
  text-align: center;
}

.node:hover,
.node.sel {
  border-color: var(--accent);
  background: var(--accent);
  color: #071007;
}

.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

::-webkit-scrollbar {
  height: 10px;
  width: 10px;
}

::-webkit-scrollbar-thumb {
  background: #293629;
  border-radius: 99px;
}

::-webkit-scrollbar-track {
  background: #050805;
}

@media (max-width: 640px) {
  textarea.code {
    min-height: 180px;
    font-size: 12px;
  }
}

.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}

.hover\:bg-\[var\(--surface-3\)\]:hover {
  background-color: var(--surface-3);
}

.hover\:bg-white\/20:hover {
  background-color: rgb(255 255 255 / 0.2);
}

.hover\:opacity-100:hover {
  opacity: 1;
}

.active\:translate-x-\[2px\]:active {
  --tw-translate-x: 2px;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:translate-y-\[2px\]:active {
  --tw-translate-y: 2px;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.active\:shadow-none:active {
  --tw-shadow: 0 0 #0000;
  --tw-shadow-colored: 0 0 #0000;
  box-shadow: var(--tw-ring-offset-shadow, 0 0 #0000), var(--tw-ring-shadow, 0 0 #0000), var(--tw-shadow);
}

.disabled\:cursor-not-allowed:disabled {
  cursor: not-allowed;
}

.disabled\:opacity-40:disabled {
  opacity: 0.4;
}

.disabled\:opacity-50:disabled {
  opacity: 0.5;
}

.disabled\:opacity-60:disabled {
  opacity: 0.6;
}

@media (min-width: 640px) {
  .sm\:h-11 {
    height: 2.75rem;
  }

  .sm\:min-h-\[400px\] {

  }

  }

  }

  .sm\:px-5 {

  .sm\:pt-5 {

  }

  .sm\:text-2xl {

  }

  .sm\:text-3xl {
    font-size: 1.875rem;

  .sm\:text-base {

  }
