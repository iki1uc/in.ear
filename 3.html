<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NC · ASSIMILIEREN · 7 Schritte</title>
<style>
:root{color-scheme:dark;--bg:#050505;--card:#111;--line:#333;--g:#00ff66;--y:#ffd166;--r:#ff5555;--b:#66ccff;--t:#f5f5f5;--m:#999}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.5 Consolas,monospace;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:20;background:#050505ee;backdrop-filter:blur(8px);border-bottom:2px solid var(--g);padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
h1{margin:0 0 6px;font-size:16px;color:var(--g);letter-spacing:2px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
button,select{font:inherit;color:var(--t);background:#0b0b0b;border:1px solid #444;border-radius:8px;padding:9px 12px;min-height:44px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--g)}button:disabled{opacity:.3;cursor:not-allowed}
button.ok{border-color:var(--g);color:var(--g)}button.go{background:var(--g);color:#000;font-weight:700;border-color:var(--g)}
main{max-width:1100px;margin:auto;padding:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 10px;min-width:0}
h2{margin:0 0 6px;font-size:13px;color:var(--y);letter-spacing:1px}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
textarea{width:100%;min-height:110px;background:#000;color:var(--t);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 Consolas,monospace;resize:vertical}
.muted{color:var(--m);font-size:12px}.okc{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}
pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:4px 6px;border-bottom:1px solid #222;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{color:var(--b)}
.res{height:260px;overflow:auto;background:#000;border:1px solid var(--line);border-radius:8px;padding:8px}
#log{height:160px;overflow:auto}
svg{display:block;max-width:100%}
@media(max-width:640px){button,select{min-height:48px}}
</style>
</head>
<body>
<header>
  <h1>ASSIMILIEREN · 4 Felder → 1 Ergebnis</h1>
  <div class="steps" id="steps">
    <button data-s="1" type="button">1 NIMM</button><button data-s="2" type="button">2 SPLIT</button><button data-s="3" type="button">3 DOPPEL WEG</button>
    <button data-s="4" type="button">4 ORDNEN</button><button data-s="5" type="button">5 KOPF</button><button data-s="6" type="button">6 FUSS</button><button data-s="7" type="button">7 PRÜFEN</button>
    <select id="mode" aria-label="Ordnung"><option value="ORG">ORG · q. h. b. t. mys. Rest</option><option value="REORG">REORG · Rest … mys. t. b. h. q.</option></select>
    <button id="all" class="go" type="button">ALLE 7</button><button id="neu" type="button">NEU (Log bleibt)</button>
  </div>
  <div class="muted" id="stat" style="margin-top:4px"></div>
</header>
<main>
  <div class="four" id="four"></div>

  <div class="card"><h2>Schritte</h2><div id="out"></div></div>

  <div class="card"><h2>7 · PRÜFEN · IQQQ</h2><div id="iq" class="muted">Noch nicht geprüft.</div></div>
  <div class="card"><h2>KONSTELLATION · ANKER · ACHSEN · FREIHEIT</h2><div id="konst" class="muted">Nach Schritt 7.</div><svg id="svg" viewBox="0 0 420 260" width="100%" aria-label="Vier Achsen der Quellen"></svg></div>
  <div class="card"><h2>ERGEBNIS</h2><div class="res"><pre id="res">–</pre></div>
    <div style="margin-top:8px"><button id="saveRes" type="button" disabled>ERGEBNIS SPEICHERN</button></div></div>
  <div class="card"><h2>LOG · nur anhängen</h2><pre id="log" role="status" aria-live="polite"></pre><div class="muted" id="lc"></div>
    <button id="saveLog" type="button" style="margin-top:6px">LOG SPEICHERN</button></div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const NAMEN=["Datei 1","Datei 2","Datei 3","PX"],TAG=["D1","D2","D3","PX"];
const PRE=["q.","h.","b.","t.","mys."],GRP=["q.","h.","b.","t.","mys.","Rest"];
const FN=/(^|[^a-z0-9_])(org|reorg|fall|un\.fall|rum\.fall|nu\.fall)($|[^a-z0-9_])/i;
const LOGKEY="NC.ASSIM.log";
let logs=[];try{const l=JSON.parse(localStorage.getItem(LOGKEY));if(Array.isArray(l))logs=l;}catch{}
const pad=n=>String(n).padStart(2,"0"),hms=t=>{const d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())};
function L(m){logs.push({t:new Date().toISOString(),m});try{localStorage.setItem(LOGKEY,JSON.stringify(logs));}catch{}renderLog();}
function renderLog(){const s=logs.slice(-200);$("log").textContent=s.map(l=>hms(l.t)+" | "+l.m).join("\n")||"Bereit.";$("log").scrollTop=$("log").scrollHeight;$("lc").textContent=logs.length+" Zeilen";}
const fnv=s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,"0");};
const dr=n=>n>0?1+((n-1)%9):0;                       // Quersumme bis 1 Ziffer ("nur als 9 lesen")
const grpOf=t=>{const l=t.toLowerCase(),i=PRE.findIndex(p=>l.startsWith(p));return i<0?5:i;};
const isFunk=t=>grpOf(t)<5||FN.test(t);
function download(name,text){const u=URL.createObjectURL(new Blob([text],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}

const fresh=()=>({done:0,fields:[],lines:[],leer:0,unique:[],removed:0,perSrc:[0,0,0,0],ordered:[],mode:"ORG",counts:[0,0,0,0,0,0],head:[],headOk:false,zeuge:"",foot:[],text:"",iq:null,ziel:false,konst:null});
let A=fresh(),dateien=[[],[],[],[]];

// ---- die 7 Schritte ----
function s1(){A.fields=NAMEN.map((n,i)=>({name:n,text:$("f"+i).value}));A.done=1;
  L("1 NIMM · "+A.fields.map((f,i)=>TAG[i]+" "+f.text.length+" Zeichen").join(" · "));}
function s2(){A.lines=[];A.leer=0;
  A.fields.forEach((f,i)=>f.text.split(/\r?\n/).forEach(r=>{const t=r.trim();if(t==="")A.leer++;else A.lines.push({t,src:i});}));
  A.done=2;L("2 SPLIT · "+A.lines.length+" Zeilen · "+A.leer+" leere weg");}
function s3(){const m=new Map();A.removed=0;A.perSrc=[0,0,0,0];
  A.lines.forEach(l=>{const u=m.get(l.t);if(u){u.count++;if(!u.srcs.includes(l.src))u.srcs.push(l.src);A.removed++;A.perSrc[l.src]++;}else m.set(l.t,{t:l.t,srcs:[l.src],count:1});});
  A.unique=[...m.values()];A.done=3;L("3 DOPPEL WEG · "+A.lines.length+" → "+A.unique.length+" · "+A.removed+" Doppelte weg ("+TAG.map((t,i)=>t+" "+A.perSrc[i]).join(", ")+")");}
function s4(){A.mode=$("mode").value;
  const dec=A.unique.map((u,i)=>({u,i,g:grpOf(u.t)}));
  dec.sort((a,b)=>(A.mode==="ORG"?a.g-b.g:b.g-a.g)||a.i-b.i);      // stabil: innerhalb einer Gruppe bleibt die Reihenfolge
  A.ordered=dec.map(d=>d.u);A.counts=[0,0,0,0,0,0];dec.forEach(d=>A.counts[d.g]++);
  A.done=4;L("4 ORDNEN ("+A.mode+") · "+GRP.map((g,i)=>g+" "+A.counts[i]).join(" · "));}
function s5(){A.head=["729.729.729","NUR ALS 9 LESEN","999 99 9 99 999","Name ist Funktion"];
  const nums=A.head.join(" ").match(/\d+/g).map(Number);A.headOk=nums.every(n=>dr(n)===9);
  A.done=5;L("5 KOPF · Quersummen "+nums.map(n=>n+"→"+dr(n)).join(" ")+" · "+(A.headOk?"alle = 9 ✓":"nicht alle 9 ✗"));}
function s6(){const body=A.head.join("\n")+"\n"+A.ordered.map(u=>u.t).join("\n");A.zeuge=fnv(body);
  A.foot=["ZEUGE "+A.zeuge+" · "+A.ordered.length+" Zeilen · "+A.removed+" Doppelte weg · "+A.fields.filter(f=>f.text.trim()).length+"/4 Felder","HALT = ZIEL"];
  A.text=body+"\n"+A.foot.join("\n")+"\n";A.done=6;L("6 FUSS · ZEUGE "+A.zeuge+" · HALT = ZIEL");}
function s7(){
  const u=A.ordered,iq={
    Q1:{n:"Quant > 0",v:u.length,ok:u.length>0},
    Q2:{n:"Qi > 0 (Zeilen mit Funktionsname)",v:u.filter(x=>isFunk(x.t)).length,ok:u.filter(x=>isFunk(x.t)).length>0},
    Q3:{n:"kein Doppel mehr",v:u.length-new Set(u.map(x=>x.t)).size,ok:new Set(u.map(x=>x.t)).size===u.length},
    Q4:{n:"Quelle da",v:u.filter(x=>x.srcs.length&&x.srcs.every(s=>A.fields[s].text.trim()!=="")).length,ok:u.length>0&&u.every(x=>x.srcs.length>0&&x.srcs.every(s=>A.fields[s].text.trim()!==""))}
  };
  A.iq=iq;A.ziel=Object.values(iq).every(q=>q.ok);
  // Konstellation: jede Quelle = 1 Achse
  A.konst=TAG.map((t,i)=>{const d=u.filter(x=>x.srcs.includes(i)),eigen=d.filter(x=>x.srcs.length===1),geteilt=d.length-eigen.length,anker=u.find(x=>x.srcs[0]===i);
    return{t,i,zeilen:A.lines.filter(l=>l.src===i).length,distinkt:d.length,eigen:eigen.length,geteilt,doppel:A.perSrc[i],frei:d.length?Math.round(eigen.length/d.length*100):0,anker:anker?anker.t.slice(0,70):"–"};});
  A.done=7;
  Object.entries(iq).forEach(([k,q])=>L("7 PRÜFEN · "+k+" "+q.n+" = "+q.v+" "+(q.ok?"✓":"✗")));
  L(A.ziel?"ZIEL · IQQQ 4/4 ✓ · HALT = ZIEL":"OFFEN · IQQQ "+Object.values(iq).filter(q=>q.ok).length+"/4 · PRÜFEN / WAIT · fehlt: "+Object.entries(iq).filter(([k,q])=>!q.ok).map(([k,q])=>k+" "+q.n).join(" | "));}
const SCHRITT=[null,s1,s2,s3,s4,s5,s6,s7];

// ---- Anzeige ----
function render(){
  document.querySelectorAll("[data-s]").forEach(b=>{const k=+b.dataset.s;b.disabled=A.done!==k-1;b.classList.toggle("ok",A.done>=k);});
  $("all").disabled=A.done!==0;$("mode").disabled=A.done>=4;
  const tot=[0,1,2,3].reduce((a,i)=>a+$("f"+i).value.length,0);
  $("stat").textContent="Schritt "+A.done+"/7 · "+tot+" Zeichen in den 4 Feldern"+(A.done===7?(A.ziel?" · ZIEL erreicht":" · OFFEN (PRÜFEN / WAIT)"):"");
  const o=[];
  if(A.done>=1)o.push("1 NIMM\n"+A.fields.map((f,i)=>"  "+f.name.padEnd(8)+" "+String(f.text.length).padStart(8)+" Zeichen"+(f.text.trim()?"":"  (leer)")).join("\n"));
  if(A.done>=2)o.push("2 SPLIT\n  "+A.lines.length+" Zeilen gesammelt · "+A.leer+" leere Zeilen weg");
  if(A.done>=3)o.push("3 DOPPEL WEG\n  "+A.lines.length+" → "+A.unique.length+" eindeutige Zeilen\n  "+A.removed+" Doppelte weg  ("+TAG.map((t,i)=>t+": "+A.perSrc[i]).join(" · ")+")");
  if(A.done>=4)o.push("4 ORDNEN ("+A.mode+")\n  "+GRP.map((g,i)=>g.padEnd(5)+" "+A.counts[i]).join("   "));
  if(A.done>=5)o.push("5 KOPF\n  "+A.head.join("\n  ")+"\n  Quersumme aller Zahlen = 9: "+(A.headOk?"✓":"✗"));
  if(A.done>=6)o.push("6 FUSS\n  "+A.foot.join("\n  "));
  $("out").innerHTML="";const p=document.createElement("pre");p.textContent=o.join("\n\n")||"Noch nichts. Felder füllen, dann 1 NIMM (oder ALLE 7).";$("out").appendChild(p);
  const iqEl=$("iq");iqEl.textContent="";
  if(A.iq){const t=document.createElement("table");t.innerHTML="<tr><th></th><th>Prüfung</th><th>Wert</th><th></th></tr>";
    Object.entries(A.iq).forEach(([k,q])=>{const r=t.insertRow();[k,q.n,String(q.v),q.ok?"✓":"✗"].forEach((x,i)=>{const c=r.insertCell();c.textContent=x;if(i===3)c.className=q.ok?"okc":"bad";});});
    iqEl.appendChild(t);const v=document.createElement("div");v.style.marginTop="6px";v.className=A.ziel?"okc":"warn";
    v.textContent=A.ziel?"ZIEL · HALT = ZIEL · alle 4 stehen":"OFFEN · PRÜFEN / WAIT · aufstehen: "+Object.entries(A.iq).filter(([k,q])=>!q.ok).map(([k,q])=>k+" "+q.n).join(" | ");iqEl.appendChild(v);}
  else iqEl.textContent="Noch nicht geprüft.";
  const kz=$("konst");kz.textContent="";
  if(A.konst){const t=document.createElement("table");t.innerHTML="<tr><th>Achse</th><th>Zeilen</th><th>distinkt</th><th>nur hier</th><th>geteilt</th><th>Doppel weg</th><th>Freiheit</th><th>Anker (erste Zeile)</th></tr>";
    A.konst.forEach(k=>{const r=t.insertRow();[k.t,k.zeilen,k.distinkt,k.eigen,k.geteilt,k.doppel,k.frei+"%",k.anker].forEach(x=>{r.insertCell().textContent=String(x);});});kz.appendChild(t);}
  else kz.textContent="Nach Schritt 7.";
  drawSvg();
  $("res").textContent=A.done>=6?(A.ordered.length>600?A.text.split("\n").slice(0,300).join("\n")+"\n… (Anzeige gekürzt, die Datei enthält alle "+A.ordered.length+" Zeilen)\n"+A.foot.join("\n"):A.text):(A.done>=4?A.ordered.slice(0,300).map(u=>u.t).join("\n"):"–");
  $("saveRes").disabled=A.done<6;
}
function drawSvg(){
  const s=$("svg");s.textContent="";if(!A.konst)return;
  const ns="http://www.w3.org/2000/svg",mk=(n,a)=>{const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const cx=210,cy=130,R=95,mx=Math.max(1,...A.konst.map(k=>k.distinkt)),P=A.konst.map((k,i)=>{const a=(-90+i*90)*Math.PI/180,r=30+R*k.distinkt/mx;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r,a];});
  A.konst.forEach((k,i)=>{s.appendChild(mk("line",{x1:cx,y1:cy,x2:cx+Math.cos(P[i][2])*125,y2:cy+Math.sin(P[i][2])*125,stroke:"#333"}));});
  const pair=[0,1,2,3].flatMap(a=>[0,1,2,3].filter(b=>b>a).map(b=>[a,b,A.ordered.filter(u=>u.srcs.includes(a)&&u.srcs.includes(b)).length]));
  pair.forEach(([a,b,n])=>{if(n)s.appendChild(mk("line",{x1:P[a][0],y1:P[a][1],x2:P[b][0],y2:P[b][1],stroke:"#66ccff","stroke-width":Math.min(6,1+Math.log2(1+n)),opacity:.55}));});
  A.konst.forEach((k,i)=>{s.appendChild(mk("circle",{cx:P[i][0],cy:P[i][1],r:7,fill:"#00ff66"}));
    const t=mk("text",{x:cx+Math.cos(P[i][2])*(i%2?145:0),y:cy+Math.sin(P[i][2])*(i%2?0:133)+(i===0?-4:i===2?12:4),"text-anchor":i===1?"start":i===3?"end":"middle",fill:"#f5f5f5","font-size":"11","font-family":"Consolas,monospace"});
    t.textContent=k.t+" "+k.distinkt+" · frei "+k.frei+"%";s.appendChild(t);});
}

// ---- Bedienung: alles nur per Klick ----
function bauen(){
  const f=$("four");
  NAMEN.forEach((n,i)=>{const c=document.createElement("div");c.className="card";
    c.innerHTML=`<h2>${n}${i===3?" · Pipeline":""}</h2><textarea id="f${i}" spellcheck="false" aria-label="${n}" placeholder="Text einfügen oder Datei(en) laden"></textarea><div class="muted" id="fn${i}">keine Datei</div><div style="margin-top:6px"><button type="button" data-l="${i}">DATEI(EN) LADEN</button> <input id="fi${i}" type="file" multiple hidden></div>`;f.appendChild(c);});
  NAMEN.forEach((n,i)=>{
    $("f"+i).addEventListener("input",geaendert);
    document.querySelector(`[data-l="${i}"]`).onclick=()=>$("fi"+i).click();
    $("fi"+i).onchange=async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length)return;
      const teile=[];for(const x of fs){try{teile.push(await x.text());dateien[i].push(x.name);}catch{L("LADEN abgelehnt · "+x.name+" nicht lesbar");}}
      const ta=$("f"+i);ta.value=(ta.value?ta.value+"\n":"")+teile.join("\n");$("fn"+i).textContent=dateien[i].join(", ")+" · "+ta.value.length+" Zeichen";
      L("LADEN · "+TAG[i]+" ← "+fs.map(x=>x.name).join(", "));geaendert();};
  });
}
function geaendert(){if(A.done>0){A=fresh();L("Eingabe geändert · Verfahren beginnt wieder bei Schritt 1");}render();}
function schritt(k){if(A.done!==k-1)return;SCHRITT[k]();render();}
$("steps").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b)schritt(+b.dataset.s);});
$("all").onclick=()=>{L("ALLE 7 geklickt");for(let k=1;k<=7;k++)schritt(k);};
$("neu").onclick=()=>{A=fresh();L("NEU geklickt · Felder bleiben, Verfahren beginnt bei Schritt 1");render();};
$("mode").onchange=()=>L("Ordnung gewählt: "+$("mode").value);
$("saveRes").onclick=()=>{L("ERGEBNIS SPEICHERN geklickt · ZEUGE "+A.zeuge);download("assimiliert-"+A.zeuge+".txt",A.text);};
$("saveLog").onclick=()=>{L("LOG SPEICHERN geklickt");download("NC-LOG.txt",logs.map(l=>new Date(l.t).toLocaleDateString("sv-SE")+" "+hms(l.t)+" | "+l.m).join("\n")+"\n");};
bauen();renderLog();L("ASSIMILIEREN geöffnet. Kein Auto-Start. 4 Felder füllen, dann klicken.");render();
</script>
</body>
</html>
