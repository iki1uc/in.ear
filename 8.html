<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EIN OS · v4 · ZOOM + BIO.TEL</title>
<style>
:root{--bg:#02060a;--surface:#0a1220;--border:#1c2f4a;--gold:#ffd700;--cyan:#00ccff;--green:#39ff88;--red:#ff5a5f;--orange:#ff7a18;--violet:#a855f7;--smaragd:#00ffaa;--text:#e8ebf5;--dim:#6b7f99;--dim2:#8899aa;--c:#00ccff}
*{box-sizing:border-box;font-family:"JetBrains Mono",ui-monospace,monospace}
html,body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border)}
.tabbar{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:2000}
.tabbar b{color:var(--gold);margin-right:8px;font-size:13px}
.tabbar button{font-size:12px;padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim2)}
.tabbar button:hover{color:var(--text)}
.tabbar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tabbar button[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700}
.view{display:none}.view.on{display:block}
#header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;background:rgba(2,6,10,.98);border-bottom:1px solid var(--c);min-height:52px}
.logo{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--c);padding:4px 8px;border:1px solid var(--c);border-radius:4px}
.title{font-size:11px;font-weight:700;letter-spacing:.1em}.title small{font-size:8px;color:var(--dim);margin-left:6px;font-weight:400}
.vital{display:flex;align-items:center;gap:4px;font-size:10px;padding:3px 7px;border:1px solid var(--border);border-radius:4px;background:rgba(0,0,0,.4)}
.vital b{font-weight:700}.vital .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.atem-bar{width:60px;height:4px;background:#000;border-radius:2px;overflow:hidden}.atem-fill{height:100%;background:var(--c);transition:width 1s linear}
.hb-btn{padding:4px 8px;font-size:9px;font-weight:700;letter-spacing:.08em;border:1px solid var(--border);border-radius:4px;background:transparent;color:var(--text)}
.hb-btn.on{background:var(--gold);border-color:var(--gold);color:#000}
#weg{display:flex;gap:3px;padding:6px 10px;background:rgba(2,6,10,.92);border-bottom:1px solid var(--border);overflow-x:auto}
.weg-btn{flex:1;min-width:100px;padding:5px 8px;font-size:9px;font-weight:700;letter-spacing:.06em;border:1px solid var(--border);border-radius:4px;background:rgba(0,0,0,.4);color:var(--dim2);display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left}
.weg-btn.active{border-color:var(--wc);background:rgba(255,255,255,.03);color:var(--wc);box-shadow:0 0 8px var(--wc)}
.weg-btn small{font-size:7px;opacity:.7;font-weight:400}.weg-btn:hover{border-color:var(--dim2);color:var(--text)}
#axioms{display:flex;gap:2px;padding:4px 10px;background:rgba(2,6,10,.88);border-bottom:1px solid var(--border);overflow-x:auto}
.axiom-btn{flex:1;min-width:60px;padding:4px 6px;font-size:8px;font-weight:700;letter-spacing:.05em;border:1px solid var(--ax);border-radius:3px;background:rgba(0,0,0,.5);color:var(--ax)}
.axiom-btn.sealed{background:var(--ax);color:#000;box-shadow:0 0 10px var(--ax)}
.axiom-btn small{display:block;font-size:6px;opacity:.6;font-weight:400;margin-top:1px}
#desk{position:relative;min-height:calc(100vh - 300px);overflow:hidden;background:radial-gradient(600px 400px at 50% 50%,rgba(0,204,255,.06),transparent),var(--bg);padding:8px}
#bio-pulse{position:absolute;left:0;right:0;top:0;height:60px;pointer-events:none;opacity:.4}
#pulse-canvas{width:100%;height:100%;display:block}
.win{position:absolute;background:rgba(8,14,22,.96);border:1px solid var(--c);border-radius:8px;display:flex;flex-direction:column;box-shadow:0 0 20px rgba(0,204,255,.15);max-height:calc(100% - 8px);min-width:200px}
.win-head{height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:10px;font-weight:700;background:linear-gradient(90deg,rgba(0,204,255,.15),transparent);border-bottom:1px solid var(--border);cursor:move;user-select:none;flex-shrink:0}
.win-head .actions{display:flex;gap:3px}
.win-head button{width:18px;height:18px;border:1px solid rgba(255,255,255,.15);border-radius:50%;background:rgba(255,255,255,.05);color:var(--text);font-size:11px;display:grid;place-items:center;padding:0}
.win-head button:hover{background:rgba(255,90,95,.5);border-color:var(--red)}
.win-body{flex:1;overflow:auto;padding:8px;min-height:0;font-size:10px;line-height:1.4}
#dock{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:6px 10px;background:rgba(2,6,10,.94);border-top:1px solid var(--c)}
.dock-btn{height:32px;padding:0 10px;font-size:9px;font-weight:700;letter-spacing:.06em;border:1px solid var(--border);border-radius:5px;background:rgba(0,0,0,.5);color:var(--dim2);white-space:nowrap}
.dock-btn.open{background:var(--c);color:#000;border-color:var(--c);box-shadow:0 0 8px var(--c)}
.dock-btn:hover{border-color:var(--dim2);color:var(--text)}
.dock-spacer{flex:1;min-width:10px}.dock-info{font-size:8px;opacity:.5;letter-spacing:.08em}
#tel-log{max-height:0;overflow:hidden;background:rgba(2,6,10,.96);border-top:1px solid var(--border);transition:max-height .2s}
#tel-log.open{max-height:140px}
.tel-inner{padding:6px 10px;font-size:9px;line-height:1.5;overflow-y:auto;max-height:140px}
.tel-line{display:flex;gap:8px;padding:1px 0;border-bottom:1px dotted rgba(28,47,74,.3)}
.tel-line .ts{color:var(--dim);min-width:50px;font-size:8px}.tel-line .from{color:var(--cyan);min-width:60px;font-weight:700;font-size:8px}.tel-line .msg{flex:1;color:var(--dim2)}
.axes{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:4px 0}
.axis{aspect-ratio:1;border:1px solid var(--border);border-radius:4px;background:rgba(0,0,0,.5);color:var(--dim2);font-size:8px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.axis.center{border-color:var(--green);background:rgba(57,255,136,.08);color:var(--green)}
.axis small{font-size:6px;opacity:.6}
.vital-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.vital-item{border:1px solid var(--border);border-radius:4px;padding:4px;background:rgba(0,0,0,.3)}
.vital-item .k{font-size:7px;color:var(--dim);letter-spacing:.1em}.vital-item .v{font-size:11px;font-weight:700;color:var(--gold);margin-top:1px}
.axiom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.axiom-card{aspect-ratio:1;border:1px solid var(--ax);border-radius:4px;background:rgba(0,0,0,.4);color:var(--ax);font-size:7px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;text-align:center;gap:1px}
.axiom-card.sealed{background:var(--ax);color:#000;box-shadow:0 0 8px var(--ax)}
.axiom-card small{font-size:6px;opacity:.6}
.prism{display:flex;height:20px;gap:1px;margin:4px 0}.prism-bar{flex:1;border-radius:2px;opacity:.4}
.pyr{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0}.pyr-svg{width:100%;height:100px}
.bus{display:grid;grid-template-columns:1fr 30px 1fr;gap:4px;align-items:center;padding:6px 0}
.bus-cpu,.bus-cocpu{border:1px solid;border-radius:4px;padding:6px;text-align:center;font-size:8px;font-weight:700}
.bus-cpu{border-color:var(--cyan);color:var(--cyan);background:rgba(0,204,255,.08)}
.bus-cocpu{border-color:var(--violet);color:var(--violet);background:rgba(168,85,247,.08)}
.bus-arrow{font-size:12px;color:var(--c);text-align:center}
.bus-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px;font-size:7px}
.bus-stat{border:1px solid var(--border);border-radius:3px;padding:3px;text-align:center}
.bus-stat.on{border-color:var(--green);color:var(--green);background:rgba(57,255,136,.1)}
.tri{display:flex;flex-direction:column;gap:4px}
.tri-slider{display:grid;grid-template-columns:60px 1fr 40px;gap:4px;align-items:center;font-size:8px}
.tri-slider b{color:var(--gold);font-size:9px;text-align:right}
input[type=range]{width:100%;height:4px;accent-color:var(--c)}
.station-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:4px 0}
.station{aspect-ratio:1;border:1px solid var(--border);border-radius:2px;background:rgba(0,0,0,.4);font-size:6px;display:grid;place-items:center;color:var(--dim);cursor:pointer}
.station.on{background:var(--sc);color:#000;border-color:var(--sc);box-shadow:0 0 4px var(--sc)}
.term-box{background:#000;border:1px solid var(--border);border-radius:4px;padding:6px;font-size:9px;line-height:1.4;max-height:200px;overflow-y:auto;white-space:pre-wrap;color:var(--green)}
.term-in{display:flex;gap:4px;margin-top:4px}
.term-in input{flex:1;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--text);padding:3px 6px;font-size:9px;border-radius:3px}
.term-in button{background:var(--c);color:#000;border:none;border-radius:3px;padding:3px 8px;font-size:9px;font-weight:700}
.magma-canvas,.player-canvas,.paint-canvas{width:100%;background:#05080c;border:1px solid var(--border);border-radius:4px;display:block}
.magma-canvas{height:120px}.player-canvas{height:60px}.paint-canvas{height:140px;cursor:crosshair;touch-action:none}
.player-sel{width:100%;background:rgba(0,0,0,.5);color:var(--text);border:1px solid var(--border);padding:4px;font-size:9px;border-radius:3px}
.todo-list{display:flex;flex-direction:column;gap:2px;max-height:200px;overflow-y:auto}
.todo-item{display:flex;gap:4px;align-items:center;font-size:9px;padding:2px 4px;border:1px solid var(--border);border-radius:3px}
.todo-item.done{opacity:.4;text-decoration:line-through}.todo-item b{font-size:7px;color:var(--c)}.todo-item span{flex:1}
.todo-item input[type=checkbox]{accent-color:var(--c)}
.kal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.kal-day{aspect-ratio:1;border:1px solid var(--border);border-radius:2px;font-size:8px;display:grid;place-items:center;background:rgba(0,0,0,.3)}
.kal-day.today{border-color:var(--c);color:var(--c)}
#seal-overlay{position:fixed;inset:0;background:rgba(255,255,255,0);pointer-events:none;z-index:3000;opacity:0;transition:opacity .3s}
#seal-overlay.active{opacity:1;background:rgba(255,255,255,.15);animation:flash 1s ease-in-out}
@keyframes flash{50%{background:rgba(255,255,255,.35)}}
.zhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid rgba(74,222,128,.25)}
.zt{margin-right:auto;color:#4ade80;font-weight:bold;letter-spacing:2px;font-size:12px}
.zhead button,.zhead input{background:#111827;color:#4ade80;border:1px solid #4ade80;border-radius:6px;padding:5px 10px;font:inherit;font-size:12px}
.zhead button{cursor:pointer}.zhead button.on{background:#4ade80;color:#071018}
.zhead input{width:180px;color:#e6edf7}.zhead input::placeholder{color:#8292a3}
#cv{width:100%;height:calc(100vh - 130px);min-height:320px;display:block}
#info{padding:7px;text-align:center;color:#f59e0b;font-size:12px;border-top:1px solid rgba(74,222,128,.15);white-space:pre-line}
@media(max-width:700px){
  #header{position:static;flex-wrap:wrap}
  #desk{min-height:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
  .win{position:relative !important;width:100% !important;height:auto !important;left:auto !important;top:auto !important;max-height:none !important;min-width:0 !important;margin:0}
  .win-body{max-height:280px}
  #bio-pulse{position:static;height:40px;margin-bottom:8px}
  .zt{width:100%}.zhead input{flex:1;min-width:130px}
}
</style>
</head>
<body>
<nav class="tabbar" role="tablist" aria-label="Ansichten">

<section id="view-os" class="view on">
<header id="header">
  <div class="logo">) (</div>
  <div class="title">EIN OS v4 · <span style="color:var(--c)">BIO.TEL</span> PRISMATIC + ZOOM<small>5 WEG · 8 AXIOME · 2268 → 4TEL 567</small></div>
  <div class="vital" style="color:var(--c)"><span class="dot"></span><span>ATEM</span><b id="atem-phase">HALTEN</b><div class="atem-bar"><div class="atem-fill" id="atem-fill" style="width: 37.5%;"></div></div><span id="atem-count" style="font-size:8px;opacity:.6">6/16</span></div>
  <div class="vital" style="color:var(--red)"><span class="dot"></span><span>CO₂</span><b id="v-co2">415</b><span style="font-size:8px;opacity:.6">ppm</span></div>
  <div class="vital" style="color:var(--cyan)"><span class="dot"></span><span>MEER</span><b id="v-sea">-57.6</b><span style="font-size:8px;opacity:.6">m</span></div>
  <div class="vital" style="color:var(--green)"><span class="dot"></span><span>O₂</span><b id="v-o2">20.93</b><span style="font-size:8px;opacity:.6">%</span></div>
  <div class="vital" style="color:var(--gold)"><span class="dot"></span><span>Σ</span><b id="v-sum" style="color: var(--smaragd);">2268</b><span style="font-size:8px;opacity:.6">/2268</span></div>
  <div class="vital" style="color:var(--smaragd)"><span class="dot"></span><span>4TEL</span><b id="v-4tel">567</b></div>

</header>
<canvas id="cv"></canvas>

<div id="seal-overlay"></div>
<script>

const WEG = [
  {id:"os", num:"01", title:"OS · KANSAS", sub:"Dorothy · BIOS", color:"#39ff88"},
  {id:"nc", num:"02", title:"NC · NEURAL", sub:"Scarecrow · brain.eye", color:"#ffd700"},
  {id:"sc", num:"03", title:"SC · CORE", sub:"Tin Man · eye.brain", color:"#00ccff"},
  {id:"for", num:"04", title:"FOR ALL · LION", sub:"Lion · vulkan", color:"#ff7a18"},
  {id:"oz", num:"05", title:"OZ · WIZARD", sub:"Wizard · bio.tel REAL", color:"#ffffff"}
];
const AXIOMS = [
  {id:"weg", name:"WEG", color:"#ff0055", group:"α"},
  {id:"ausweg", name:"AUSWEG", color:"#ff7a00", group:"α"},
  {id:"einweg", name:"EINWEG", color:"#ffd700", group:"α"},
  {id:"cpu", name:"CPU", color:"#00ccff", group:"β"},
  {id:"cocpu", name:"Co-CPU", color:"#00ffaa", group:"β"},
  {id:"bus", name:"BUS", color:"#a855f7", group:"β"},
  {id:"prisma", name:"PRISMA", color:"#ffffff", group:"γ"},
  {id:"pyra", name:"PYRA", color:"#ffcc33", group:"γ"}
];
const ORGANS = [
  {id:"VECTOR", title:"VECTOR · bio", icon:"⌖", w:340, h:340},
  {id:"PRISMATIC", title:"PRISMATIC · 8 Ax", icon:"◈", w:340, h:340},
  {id:"PYRAMIDE", title:"PYRAMIDE · Atom", icon:"▲", w:340, h:300},
  {id:"CPUCO", title:"CPU ↔ Co-CPU", icon:"⚙", w:340, h:260},
  {id:"3TEL", title:"3TEL · αβγ → 2268", icon:"∑", w:340, h:320},
  {id:"ENERGIE", title:"ENERGIE · Burst", icon:"⚡", w:300, h:240},
  {id:"MAGMA", title:"MAGMA · Vulkan", icon:"◎", w:340, h:260},
  {id:"PLAYER", title:"PLAYER · 8 Beats", icon:"▶", w:320, h:260},
  {id:"9x9", title:"9×9 · 81 Stationen", icon:"⊞", w:340, h:360},
  {id:"TERMINAL", title:"TERMINAL · bio.tel", icon:"▤", w:360, h:300},
  {id:"TODO", title:"TODO · Log", icon:"≡", w:300, h:300},
  {id:"KALENDER", title:"KALENDER · QI", icon:"▦", w:280, h:300},
  {id:"PAINT", title:"PAINT · 8 Colors", icon:"✦", w:340, h:300},
  {id:"ZOOM", title:"ZOOM · WHIRL", icon:"◉", w:340, h:240}
];
const S = {
  atem: 0, atemPhase: "EIN", co2: 415, activeWeg: "os", axioms: {},
  hb: false, windows: {}, tel: [], zCounter: 100,
  triAlpha: 702, triBeta: 1030, triGamma: 536, sum: 2268, paintColor: "#00ccff"
};
const Anim = {
  ids: {},
  start(name, fn) {
    this.stop(name);
    const loop = () => {
      this.ids[name] = requestAnimationFrame(loop);
      try { fn(); } catch(e) { this.stop(name); }
    };
    this.ids[name] = requestAnimationFrame(loop);
  },
  stop(name) { if (this.ids[name]) { cancelAnimationFrame(this.ids[name]); this.ids[name] = null; } },
  stopAll() { Object.keys(this.ids).forEach(k => this.stop(k)); }
};
const $ = id => document.getElementById(id);
const now = () => new Date().toTimeString().slice(0, 8);
const fmt = (n, d = 1) => (+n).toFixed(d);
const getSea = () => -60 + (S.co2 - 400) / 400 * 65;
const getO2 = () => 20.95 - (S.co2 - 400) / 400 * 0.65;
const fourTel = () => Math.round(S.sum / 4);
const sealedCount = () => Object.values(S.axioms).filter(Boolean).length;
function tel(from, msg) {
  S.tel.unshift({ts: now(), from, msg});
  if (S.tel.length > 100) S.tel.length = 100;
  renderTel();
}
function renderTel() {
  const box = $("tel-inner");
  if (!box) return;
  box.innerHTML = S.tel.slice(0, 40).map(t =>
    `<div class="tel-line"><span class="ts">${t.ts}</span><span class="from">[${t.from}]</span><span class="msg">${t.msg}</span></div>`
  ).join("") || `<div style="color:var(--dim);padding:20px;text-align:center">bio.tel · keine Signale</div>`;
}
function initState() {
  AXIOMS.forEach(a => S.axioms[a.id] = false);
  ORGANS.forEach((o, i) => {
    S.windows[o.id] = { open: ["VECTOR", "PRISMATIC", "3TEL"].includes(o.id), x: 20 + (i % 4) * 40, y: 20 + Math.floor(i / 4) * 30, z: 10 + i, min: false };
  });
}
function renderHeader() {
  const weg = WEG.find(w => w.id === S.activeWeg);
  if (weg) document.documentElement.style.setProperty("--c", weg.color);
  $("v-co2").textContent = S.co2;
  $("v-sea").textContent = fmt(getSea());
  $("v-o2").textContent = fmt(getO2(), 2);
  $("v-sum").textContent = S.sum;
  $("v-4tel").textContent = fourTel();
  $("v-sum").style.color = S.sum >= 2268 ? "var(--smaragd)" : "var(--gold)";
}
function renderWeg() {
  $("weg").innerHTML = WEG.map(w =>
    `<button class="weg-btn${w.id === S.activeWeg ? " active" : ""}" data-weg="${w.id}" style="--wc:${w.color}"><span>${w.num} · ${w.title}</span><small>${w.sub}</small></button>`
  ).join("");
  document.querySelectorAll("[data-weg]").forEach(b => {
    b.onclick = () => { S.activeWeg = b.dataset.weg; tel("WEG", "→ " + b.dataset.weg.toUpperCase()); renderWeg(); renderHeader(); };
  });
}
function renderAxioms() {
  $("axioms").innerHTML = AXIOMS.map(a => {
    const on = S.axioms[a.id];
    return `<button class="axiom-btn${on ? " sealed" : ""}" data-ax="${a.id}" style="--ax:${a.color}">${a.name}<small>${a.group} · ${on ? "SEALED" : "open"}</small></button>`;
  }).join("");
  document.querySelectorAll("[data-ax]").forEach(b => { b.onclick = () => toggleAxiom(b.dataset.ax); });
}
function toggleAxiom(id) {
  S.axioms[id] = !S.axioms[id];
  const a = AXIOMS.find(x => x.id === id);
  tel(a.id.toUpperCase(), S.axioms[id] ? "sealed" : "unsealed");
  if (sealedCount() === 8) triggerSeal();

function bindWindows() {
  document.querySelectorAll(".win").forEach(w => {
    const id = w.dataset.win;
    w.onpointerdown = e => {
      if (e.target.tagName === "BUTTON" || e.target.tagName === "INPUT") return;
      S.windows[id].z = ++S.zCounter;
      w.style.zIndex = S.windows[id].z;
    };
    const head = w.querySelector(".win-head");
    if (head) {
      head.onpointerdown = e => {
        if (e.target.tagName === "BUTTON") return;
        const sx = e.clientX, sy = e.clientY;
        const ox = S.windows[id].x, oy = S.windows[id].y;
        S.windows[id].z = ++S.zCounter;
        w.style.zIndex = S.windows[id].z;
        const move = ev => {
          const nx = Math.max(0, Math.min(window.innerWidth - 100, ox + ev.clientX - sx));
          const ny = Math.max(0, Math.min(window.innerHeight - 200, oy + ev.clientY - sy));
          S.windows[id].x = nx; S.windows[id].y = ny;
          w.style.left = nx + "px"; w.style.top = ny + "px";
        };
        const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      };
    }
  });
  document.querySelectorAll("[data-act]").forEach(b => {
    b.onclick = () => {
      const id = b.dataset.id;

function drawPulse() {
  const cv = $("pulse-canvas");
  if (!cv) return;
  const parent = cv.parentElement;
  if (!parent) return;
  const rect = parent.getBoundingClientRect();
  cv.width = Math.max(rect.width || 300, 100);
  cv.height = 60;
  const ctx = cv.getContext("2d");
  let t = 0;
  Anim.start("pulse", () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--c").trim() || "#00ccff";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    const ap = Math.sin((S.atem / 16) * Math.PI * 2);
    for (let x = 0; x < cv.width; x += 3) {
      const y = cv.height / 2 + Math.sin(x * 0.02 + t * 0.05) * 8 * (1 + ap * 0.5);
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    t++;
  });
}
function drawMagma() {
  const cv = $("magma-canvas");
  if (!cv) return;
  cv.width = Math.max(cv.clientWidth || 300, 100);
  cv.height = 120;
  const ctx = cv.getContext("2d");
  const blobs = AXIOMS.map(a => ({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: 15 + Math.random() * 20, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6, color: a.color }));
  Anim.start("magma", () => {
    ctx.fillStyle = "rgba(5,8,12,0.2)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    blobs.forEach(b => {
      b.x += b.vx * (S.hb ? 1.5 : 1);
      b.y += b.vy * (S.hb ? 1.5 : 1);
      if (b.x < 0 || b.x > cv.width) b.vx *= -1;
      if (b.y < 0 || b.y > cv.height) b.vy *= -1;
      const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, b.color);
      g.addColorStop(1, "transparent");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });
  });
}
function drawPlayer() {

  let t = 0;
  Anim.start("player", () => {
    ctx.fillStyle = "rgba(8,14,20,0.3)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--c").trim() || "#00ccff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < cv.width; i += 2) {
      const y = cv.height / 2 + Math.sin(i * 0.08 + t * 0.1) * 15 + Math.sin(i * 0.15 + t * 0.05) * 8;
      if (i === 0) ctx.moveTo(i, y); else ctx.lineTo(i, y);
    }
    ctx.stroke();
    t++;
  });
}
function bindPaint() {
  const cv = $("paint-canvas");
  if (!cv) return;
  cv.width = Math.max(cv.clientWidth || 300, 100);
  cv.height = 140;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#0a1218";
  ctx.fillRect(0, 0, cv.width, cv.height);
  let down = false;
  const draw = e => {
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) * cv.width / r.width;
    const y = (e.clientY - r.top) * cv.height / r.height;
    ctx.fillStyle = S.paintColor;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  };
  cv.onpointerdown = e => { down = true; draw(e); };
  cv.onpointermove = e => { if (down) draw(e); };
  cv.onpointerup = () => { down = false; };
  cv.onpointerleave = () => { down = false; };
}
function paintClear() {
  const cv = $("paint-canvas");
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#0a1218";
  ctx.fillRect(0, 0, cv.width, cv.height);
  tel("PAINT", "clear");
}
function paintExport() {
  const cv = $("paint-canvas");
  if (!cv) return;
  const a = document.createElement("a");
  a.href = cv.toDataURL();
  a.download = "bio-tel-paint.png";
  a.click();
  tel("PAINT", "export png");
}
function tickAtem() {
  S.atem = (S.atem + 1) % 16;
  const phase = S.atem < 4 ? "EIN" : S.atem < 8 ? "HALTEN" : S.atem < 12 ? "AUS" : "HALTEN_2";
  if (phase !== S.atemPhase) { S.atemPhase = phase; tel("ATEM", phase + " · " + S.atem + "/16s"); }
  const phEl = $("atem-phase");
  if (phEl) phEl.textContent = phase;
  const fillEl = $("atem-fill");
  if (fillEl) fillEl.style.width = ((S.atem / 16) * 100) + "%";
  const cntEl = $("atem-count");
  if (cntEl) cntEl.textContent = S.atem + "/16";
}

/* ── ZOOM · WHIRL 3→9→81→9→3 ───────────────────────── */
const cv = $("cv");
const g = cv.getContext("2d");
const GREEN = "#4ade80", ORG = "#f59e0b", TXT = "#e6edf7", PAN = "#111827", STEP = 40;
const BASE = [
  {x: 50, y: 16, n: "ZOOM"},
  {x: 14, y: 76, n: "ZO.OM"},
  {x: 86, y: 76, n: "Z.O.O.M"}
];
const CEN = {x: 50, y: 52};
const L = {3: BASE.map((b, i) => ({...b, p: -1, b: i})), 9: [], 81: []};
L[3].forEach((v, i) => {
  BASE.forEach((b, j) => {
    L[9].push({x: v.x + (b.x - CEN.x) * 0.22, y: v.y + (b.y - CEN.y) * 0.22, n: b.n, p: i, b: j});
  });
});
L[9].forEach((v, i) => {
  for (let a = -1; a <= 1; a++) {
    for (let c = -1; c <= 1; c++) {
      L[81].push({x: v.x + c * 1.6, y: v.y + a * 1.6, p: i, b: v.b});
    }
  }
});
const SEQ = [3, 9, 81, 9, 3];
const INTV = {3: 1.0, 9: 0.5, 81: 0.1};
const HUE = [350, 130, 215];
let level = 3, seqI = 0, cycle = true, whirl = true;
let idx = 0, prev = 0, f = 1, steps = 0, lvSteps = 0;
let rot = 0, rotT = 0, acc = 0, msg = "sam: bereit";
let W = 0, H = 0, sc = 1, ox = 0, oy = 0, last = 0;
let zoomRunning = false, zoomRAF = null;
function setLevel(v) {
  level = v; idx = 0; prev = 0; f = 1; lvSteps = 0;
  document.querySelectorAll("[data-l]").forEach(button => {
    button.classList.toggle("on", Number(button.dataset.l) === v);
  });
}
function step(d) {
  const n = L[level].length;
  prev = idx;
  idx = (idx + d + n) % n;
  f = 0; steps += d; lvSteps += d;
  rotT = steps * STEP;
  const limit = level === 81 ? 81 : 9;
  if (cycle && d > 0 && lvSteps >= limit) {
    seqI = (seqI + 1) % SEQ.length;
    setLevel(SEQ[seqI]);
  }
}
function resize() {
  const d = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  g.setTransform(d, 0, 0, d, 0, 0);
  sc = Math.min(W / 100, H / 92);
  ox = (W - 100 * sc) / 2; oy = (H - 92 * sc) / 2;
}
function transformPoint(x, y) {
  const a = rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const dx = x - CEN.x, dy = y - CEN.y;
  return [ox + (CEN.x + dx * c - dy * s) * sc, oy + (CEN.y + dx * s + dy * c) * sc];
}
function circ(x, y, r, fill, stroke, lineWidth) {
  const pt = transformPoint(x, y);
  g.beginPath();
  g.arc(pt[0], pt[1], Math.max(0.5, r * sc), 0, Math.PI * 2);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.lineWidth = lineWidth || 1; g.strokeStyle = stroke; g.stroke(); }
}
function line(a, b, width, color) {
  const p = transformPoint(a.x, a.y), q = transformPoint(b.x, b.y);
  g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
  g.lineWidth = width; g.strokeStyle = color; g.stroke();
}
function draw(t) {
  g.fillStyle = "#070f16"; g.fillRect(0, 0, W, H);
  const R = 44, active = ((steps % 9) + 9) % 9;
  for (let k = 0; k < 9; k++) {
    const a = (-90 + k * STEP) * Math.PI / 180;
    const x = ox + (CEN.x + Math.cos(a) * R) * sc;
    const y = oy + (CEN.y + Math.sin(a) * R) * sc;
    g.beginPath();
    g.arc(x, y, (k === active ? 1.3 : 0.6) * sc, 0, Math.PI * 2);
    g.fillStyle = k === active ? ORG : "#1f3444";
    g.fill();
  }
  g.beginPath();
  g.arc(ox + CEN.x * sc, oy + CEN.y * sc, R * sc, 0, Math.PI * 2);
  g.strokeStyle = "rgba(74,222,128,.15)"; g.lineWidth = 1; g.stroke();
  line(BASE[0], BASE[1], 3, GREEN);
  line(BASE[0], BASE[2], 3, GREEN);
  line(BASE[1], BASE[2], 3, GREEN);
  if (level >= 9) L[9].forEach(n => line(L[3][n.p], n, 1.5, `hsla(${HUE[n.b]},80%,60%,.6)`));
  if (level === 81) L[81].forEach(n => line(L[9][n.p], n, 0.6, `hsla(${HUE[n.b]},80%,60%,.5)`));
  L[3].forEach(n => circ(n.x, n.y, level === 3 ? 7 : 10, PAN, GREEN, 3));
  if (level >= 9) L[9].forEach(n => circ(n.x, n.y, level === 9 ? 2.6 : 3, PAN, GREEN, 2));
  if (level === 81) L[81].forEach(n => circ(n.x, n.y, 0.65, `hsl(${HUE[n.b]},85%,62%)`));
  g.textAlign = "center"; g.fillStyle = TXT;
  if (level === 3) L[3].forEach(n => {
    const pt = transformPoint(n.x, n.y);
    g.font = `${2.4 * sc}px Consolas`;
    g.fillText(n.n, pt[0], pt[1] + 0.8 * sc);
  });
  if (level === 9) L[9].forEach(n => {
    const pt = transformPoint(n.x, n.y);
    g.font = `${1.05 * sc}px Consolas`;
    g.fillText(n.n, pt[0], pt[1] + 0.4 * sc);
  });
  g.fillStyle = ORG;
  g.font = `bold ${2.8 * sc}px Consolas`;
  g.fillText("ZOOMEND", ox + CEN.x * sc, oy + CEN.y * sc + sc);
  g.fillText("bewegen", ox + CEN.x * sc, oy + (CEN.y + 4) * sc + sc);
  const a = L[level][prev], b = L[level][idx];
  const e = f * f * (3 - 2 * f);
  const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e;
  const pulse = (Math.sin(t * 0.004) + 1) / 2;
  const radius = level === 81 ? 1 + pulse : 2 + pulse * 2;
  g.globalAlpha = 0.3 + pulse * 0.35;
  circ(x, y, radius * 1.8, ORG);
  g.globalAlpha = 1;
  circ(x, y, radius, ORG);
  const limit = level === 81 ? 81 : 9;
  const degree = ((steps * STEP) % 360 + 360) % 360;
  const shownStep = ((lvSteps % limit) + limit) % limit;
  $("info").textContent =
    `${level} · Schritt ${shownStep}/${limit} · ${degree}° · Umdrehung ${Math.floor(steps / 9)}  ·  ` +
    `${cycle ? "ZYKLUS 3→9→81→9→3" : "fest"}  ·  ${whirl ? "WHIRL läuft" : "STOP"}\n${msg}`;
}
function loop(t) {
  if (!zoomRunning) return;
  zoomRAF = requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  if (whirl) {
    acc += dt;
    if (acc >= INTV[level]) { acc = 0; step(1); }
  }
  f = Math.min(1, f + dt / INTV[level]);
  rot += (rotT - rot) * Math.min(1, dt * 8);
  draw(t);
}
function startZoom() {
  if (zoomRunning) return;
  zoomRunning = true;
  last = performance.now();
  resize();
  zoomRAF = requestAnimationFrame(loop);
}
function stopZoom() {
  zoomRunning = false;
  if (zoomRAF) cancelAnimationFrame(zoomRAF);
  zoomRAF = null;
}
function sam(command) {
  const c = command.toLowerCase().trim().replace(/^nc\s+/, "");
  if (c === "whirl") { whirl = true; step(1); sync(); return "WHIRL: dreht. 1 Atom, 40°, weiter."; }
  if (c === "rewind") { step(-1); return "REWIND: 1 Schritt zurück. nichts gelöscht."; }
  if (c === "stop" || c === "clean") {
    whirl = false; sync();
    return c === "stop" ? "STOP. alles aus. nur du." : "CLEAN: stop. schauen.";
  }
  if (c === "gong") {
    whirl = false; cycle = false; setLevel(3); seqI = 0; idx = 0; prev = 0; sync();
    return "GONG ——— kreis zu. abgang.";
  }
  if (c === "use" || c === "user") return "USER: du bist da. level 6. aktiv.";
  return "sam: whirl | rewind | stop | clean | gong";
}
function sync() {
  $("wh").classList.toggle("on", whirl);
  $("cyc").classList.toggle("on", cycle);
}
document.querySelectorAll("[data-l]").forEach(button => {
  button.addEventListener("click", () => {
    cycle = false;
    setLevel(Number(button.dataset.l));
    seqI = Math.max(0, SEQ.indexOf(level));
    sync();
  });
});
$("cyc").addEventListener("click", () => { cycle = !cycle; seqI = Math.max(0, SEQ.indexOf(level)); sync(); });
$("wh").addEventListener("click", () => { whirl = !whirl; sync(); });
$("st").addEventListener("click", () => step(1));
$("rw").addEventListener("click", () => step(-1));
$("cmd").addEventListener("keydown", event => {
  if (event.key === "Enter") { msg = sam($("cmd").value); $("cmd").value = ""; }
});
/* ── TABS · kein CO2: versteckte Ansicht = Animationen aus ── */
function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "view-" + name));
  document.querySelectorAll("[role=tab]").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === name)));
  try { history.replaceState(null, "", "#" + name); } catch(e) {}
  if (name === "zoom") {
    Anim.stopAll();
    startZoom();
    tel("ZOOM", "WHIRL-Ansicht geöffnet");
  } else {
    stopZoom();
    renderDesk();
    tel("OS", "OS-Ansicht geöffnet");
  }
}
document.querySelectorAll("[role=tab]").forEach(t => {
  t.addEventListener("click", () => showView(t.dataset.view));
});
window.addEventListener("resize", () => { if (zoomRunning) resize(); });
/* ── BOOT ─────────────────────────────────────────────── */
function boot() {
  initState();
  renderHeader(); renderWeg(); renderAxioms();
  renderDesk(); renderDock();
  renderTel();
  tel("OS", "BOOT · EIN OS v4 · BIO.TEL + ZOOM");
  tel("OS", "5 WEG · 8 AXIOME · 14 ORGANE · ATEM 16s");
  tel("OS", "Σ " + S.sum + " → 4TEL " + fourTel());
  tel("OS", "TABS · OS ↔ ZOOM · kein CO2: versteckt = aus");
  setInterval(tickAtem, 1000);
  if (location.hash === "#zoom") showView("zoom");
}
boot();
</script>
