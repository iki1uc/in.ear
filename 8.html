G 64GB DDR4 3200 SODIMM - flüchtig schnell\n→ BALL + WETTER zu gleich + ROLLE - ball entwickelt, wetter regeln internet+wetter, rolle abhängigkeiten\n→ CPU earn.js schubst zum ZIEL 100% - FUNDAMENT 81/81, GRUPPEN 27/27, WAHRHEITSNAHE <5%\n```\n\n## RAM und ROM\n\n**RAM Quellen:** ADATA XPG 64GB DDR4 3200 SODIMM 4168 MB/s, Crucial DDR5 4800, Kingston Fury - flüchtig schnell für Ball Runtime. 100% belegt wenn BALL läuft.\n\n**ROM Quellen:** spin.rom, VESTA 300k Vektoren, cdn.fbsbx.com, github.io, Amiga ROM 3.2 - persistent. check.rom 81 Kompendium prüft MESS SCHLEIFE.\n\n**Abhängigkeiten:** \n- ball hängt ab von ram+rom (RAM=Transport, ROM=Regeln)\n- wetter hängt ab von ball+ram+internet (Ball entwickelt → Wetter rendert)\n- rolle hängt ab von ball+wetter+scsi (Rolle weiß wer mit wem)\n- scsi hängt ab von raid (8 Disks → 11.88 GB/s)\n\n## Boot\n\n1. `index.html` SC bootet - Speed Commander behält Job, File Manager + UEFI\n2. F12 -> `paint.html` Übergang -> `OS.html` cycOS - Elegant Paint PR: Tusche, Gold Drip, VEC Pyramide, BORG 81, Wloch Sprung\n3. `OS.html` hat Button -> zurück zu SC - BORG 7482 VEC-OS RAM ROM CPU Worker\n\n## LHA Live Edit\n\nDateityp Selbst Entwurf: `.cyc` Datei die sich ohne Murren überschreiben lässt, bewusst abgemacht - Header mit BEWUSST ABGEMACHT Flag.\n\n- Methode: -lh5- / -lh6- / -lhd- - 64KB Dict, 4MB Window\n- Owner: iki1uc / borg / vec / wloch\n- Weise: genutzer Weise - LHA archive per user, bewusst abgemacht ohne Murren überschreibbar\n- Live: Hot Plug fähig - während RAID läuft neue LHA einhängen\n\n## RAID SWAP HDF LHA User Weise\n\n- RAID Array 8 Disks, Parity 73%, Fundament 81/81, 11.88 GB/s Turbokarte, BORG 7482\n- SWAP Tausch genutzer Weise: ramdisk 4168 MB/s ↔ NVMe 7.2 GB/s ↔ turbokarte, TAUSCH JETZT hot\n- HDF Amiga Images: cyc.hdf (512MB System), ram.hdf (64GB RAM Dump), rom.hdf (VESTA ROM), gemountet als DH0: DH1: DH2:\n- LHA per User iki1uc/borg/vec: iki1uc.cyc (BORG 7482), borg.cyc (81 Felder), vec.cyc (Pyramide)\n\n## Final
