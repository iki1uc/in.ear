<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050a05">
  <title>NC.OS · CTRL</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050a05;
      --panel: #0a0f0a;
      --line: #00ff4133;
      --green: #00ff41;
      --gold: #ffd700;
      --text: #d7e3d8;
      --muted: #91a092;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, sans-serif;
    }

    main {
      width: min(560px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
    }

    .label {
      color: var(--green);
      font: 12px/1.4 monospace;
      letter-spacing: .16em;
    }

    h1 {
      margin: 8px 0 4px;
      color: var(--green);
      font: 700 clamp(28px, 7vw, 42px)/1.1 monospace;
    }

    p, .detail { color: var(--muted); }

    .status {
      margin: 24px 0;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #050a05;
    }

    .status strong { color: var(--green); }
    .detail { margin-top: 4px; font: 13px monospace; }

    button {
      padding: 10px 14px;
      border: 1px solid var(--green);
      border-radius: 8px;
      background: transparent;
      color: var(--green);
      font: inherit;
      cursor: pointer;
    }

    button:hover, button:focus-visible {
      background: var(--green);
      color: #050a05;
    }

    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    footer {
      margin-top: 22px;
      color: var(--muted);
      font: 12px monospace;
    }
  </style>
</head>

<body>
  <main>
    <div class="label">NC.OS · CONTROL</div>
    <h1>CTRL</h1>
    <p>Systemübersicht und lokale Steuerung.</p>

    <section class="status" aria-live="polite">
      <strong id="state">STATUS: BEREIT</strong>
      <div class="detail" id="time"></div>
    </section>

    <button id="refresh" type="button">Status aktualisieren</button>

    <footer>CTRL · Eigenadmin im eigenen Terrain</footer>
  </main>

  <script>
    const time = document.querySelector("#time");
    const state = document.querySelector("#state");

    function updateStatus() {
      time.textContent = new Intl.DateTimeFormat("de-DE", {
        dateStyle: "medium",
        timeStyle: "medium"
      }).format(new Date());

      state.textContent = "STATUS: BEREIT";
    }

    document.querySelector("#refresh").addEventListener("click", updateStatus);
    updateStatus();
  </script>
</body>
</html>
