<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NC.OS ROOT · Position 0</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #111319;
      color: #e7eaf0;
      font: 14px ui-monospace, Consolas, monospace;
    }
    header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #292d37;
    }
    header strong { font-size: 20px; letter-spacing: .04em; }
    main {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) 170px;
      gap: 16px;
      max-width: 1180px;
      margin: 24px auto;
      padding: 0 16px;
    }
    nav, aside, .card {
      background: #191c24;
      border: 1px solid #292d37;
      border-radius: 12px;
    }
    nav, aside { padding: 16px; }
    nav h2, aside h2 {
      margin: 0 0 14px;
      font-size: 12px;
      color: #9da5b5;
      text-transform: uppercase;
    }
    nav button, aside button, .toolbar button {
      width: 100%;
      margin: 4px 0;
      padding: 10px;
      background: #20242e;
      color: #dce2ec;
      border: 1px solid #343a47;
      border-radius: 7px;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    button:hover { border-color: #45e69a; }
    .center { min-width: 0; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #9da5b5;
    }
    .toolbar button { width: auto; margin: 0; }
    #breadcrumb { margin-left: auto; }
    #matrix {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      min-height: 150px;
      padding: 16px;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .card:hover {
      border-color: #45e69a;
      transform: translateY(-2px);
    }
    .card .pos { color: #45e69a; font-size: 12px; }
    .card h3 { margin: 18px 0 8px; font-size: 15px; }
    .card p { margin: 0; color: #9da5b5; font-size: 12px; line-height: 1.5; }
    .status { color: #45e69a; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      #matrix { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <strong>NC.OS</strong>
    <span>ROOT · POSITION 0</span>
  </header>

  <main>
    <nav>
      <h2>Baum</h2>
      <button id="rootButton">ROOT</button>
      <button id="backButton">← Zurück</button>
      <p id="treeInfo"></p>
    </nav>

    <section class="center">
      <div class="toolbar">
        <button id="zoomOut">−</button>
        <button id="zoomIn">+</button>
        <button id="resetZoom">Zoom zurücksetzen</button>
        <span id="breadcrumb">ROOT</span>
      </div>
      <div id="matrix" aria-label="3 mal 3 Matrix"></div>
    </section>

    <aside>
      <h2>Auswahl</h2>
      <p>Position: <b>0</b></p>
      <p>Kind: <b>1</b></p>
      <p>Ansicht: <b>1</b></p>
      <p class="status" id="message">Bereit</p>
    </aside>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "NC_OS_ROOT";
    const MAX_DEPTH = 6;

    const state = {
      version: "NC.OS ROOT",
      path: [],
      currentId: 1,
      level: 0,
      viewport: { x: 0, y: 0, zoom: 1 },
      tree: null,
      nextId: 1
    };

    function createNode(id, level, path) {
      return {
        id,
        level,
        path: [...path],
        title: level === 0 ? "ROOT" : `Knoten ${path.join(".")}`,
        children: []
      };
    }

    function buildTree(level = 0, path = []) {
      const node = createNode(state.nextId++, level, path);

      if (level < MAX_DEPTH) {
        for (let kind = 1; kind <= 3; kind++) {
          node.children.push(buildTree(level + 1, [...path, kind]));
        }
      }
      return node;
    }

    function nodeFromPath(path) {
      let node = state.tree;
      for (const kind of path) {
        if (!Number.isInteger(kind) || kind < 1 || kind > 3) return null;
        node = node?.children[kind - 1];
        if (!node) return null;
      }
      return node;
    }

    function syncNavigation() {
      const node = nodeFromPath(state.path);
      if (!node) {
        state.path = [];
        state.currentId = state.tree.id;
        state.level = 0;
        return;
      }
      state.currentId = node.id;
      state.level = node.level;
    }

    function enter(pos) {
      if (pos < 0 || pos > 8) return;

      const kind = (pos % 3) + 1;
      const view = Math.floor(pos / 3) + 1;
      const current = nodeFromPath(state.path);

      if (!current || current.level >= MAX_DEPTH) {
        document.getElementById("message").textContent = "Maximale Tiefe erreicht";
        return;
      }

      // Position bestimmt Kind und Ansicht.
      // Die Baumkante wird allein durch kind bestimmt.
      state.path.push(kind);
      syncNavigation();

      document.getElementById("message").textContent =
        `Position ${pos} · Kind ${kind} · Ansicht ${view}`;
      render();
      save();
    }

    function goBack() {
      if (state.path.length === 0) return;
      state.path.pop();
      syncNavigation();
      document.getElementById("message").textContent = "Zurück navigiert";
      render();
      save();
    }

    function render() {
      const matrix = document.getElementById("matrix");
      const node = nodeFromPath(state.path);
      if (!node) return;

      matrix.replaceChildren();

      for (let pos = 0; pos < 9; pos++) {
        const kind = (pos % 3) + 1;
        const view = Math.floor(pos / 3) + 1;
        const child = node.children[kind - 1];

        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.setAttribute("aria-label",
          `Position ${pos}, Kind ${kind}, Ansicht ${view}`);

        card.innerHTML = `
          <span class="pos">POS ${pos} · ANSICHT ${view}</span>
          <h3>Kind ${kind}</h3>
          <p>${child ? child.title : "Blattknoten"} · ID ${child ? child.id : "—"}</p>
        `;
        card.addEventListener("click", () => enter(pos));
        matrix.appendChild(card);
      }

      document.getElementById("breadcrumb").textContent =
        ["ROOT", ...state.path].join(" > ");
      document.getElementById("treeInfo").textContent =
        `Ebene ${state.level} · Knoten ${state.currentId}`;
    }

    function setZoom(nextZoom) {
      state.viewport.zoom = Math.max(0.25, Math.min(8, nextZoom));
      document.getElementById("matrix").style.transform =
        `scale(${state.viewport.zoom})`;
      document.getElementById("matrix").style.transformOrigin = "top center";
      save();
    }

    function save() {
      try {
        // Der Baum wird deterministisch neu erstellt und deshalb nicht gespeichert.
        const { tree, nextId, ...persisted } = state;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(persisted));
      } catch {
        document.getElementById("message").textContent = "Speichern fehlgeschlagen";
      }
    }

    function restore() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (!saved || saved.version !== "NC.OS ROOT") return;

        if (Array.isArray(saved.path) &&
            saved.path.every(n => Number.isInteger(n) && n >= 1 && n <= 3) &&
            saved.path.length <= MAX_DEPTH) {
          state.path = saved.path;
        }
        if (saved.viewport && Number.isFinite(saved.viewport.zoom)) {
          state.viewport.zoom = Math.max(0.25, Math.min(8, saved.viewport.zoom));
        }
      } catch {
        localStorage.removeItem(STORAGE_KEY);
      }
    }

    state.tree = buildTree();
    restore();
    syncNavigation();

    document.getElementById("backButton").addEventListener("click", goBack);
    document.getElementById("rootButton").addEventListener("click", () => {
      state.path = [];
      syncNavigation();
      render();
      save();
    });
    document.getElementById("zoomIn").addEventListener("click", () =>
      setZoom(state.viewport.zoom * 1.2));
    document.getElementById("zoomOut").addEventListener("click", () =>
      setZoom(state.viewport.zoom / 1.2));
    document.getElementById("resetZoom").addEventListener("click", () =>
      setZoom(1));

    render();
    setZoom(state.viewport.zoom);
  </script>
</body>
</html>
