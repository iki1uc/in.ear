<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050805">
  <title>NC.OS · Freudenhund</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #050805;
      --panel: #0b120d;
      --line: #294832;
      --green: #4ade80;
      --gold: #ffd700;
      --text: #e1ebe3;
      --muted: #9aaa9e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
      border-bottom: 1px solid var(--line);
      background: #050805ee;
      backdrop-filter: blur(10px);
    }

    .top, nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top { justify-content: space-between; }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: 17px;
      letter-spacing: .04em;
    }

    .role, .case-link, button {
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
    }

    .role {
      padding: 4px 9px;
      color: var(--gold);
      font-size: 12px;
    }

    nav {
      overflow-x: auto;
      padding-top: 10px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    .case-link {
      flex: 0 0 auto;
      min-width: 42px;
      padding: 7px 10px;
      color: var(--muted);
      text-align: center;
      text-decoration: none;
    }

    .case-link[aria-current="page"] {
      border-color: var(--green);
      color: var(--green);
    }

    main {
      width: min(100%, 760px);
      margin: auto;
      padding: 14px;
    }

    .card {
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }

    h2 {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: 14px;
    }

    .muted {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .scanner {
      display: grid;
      gap: 12px;
      justify-items: center;
      padding: 26px 16px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
    }

    .scanner-icon {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      border: 1px solid var(--green);
      border-radius: 50%;
      color: var(--green);
      font-size: 30px;
    }

    button {
      min-height: 46px;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }

    button:hover, button:focus-visible, .case-link:focus-visible {
      border-color: var(--green);
      outline: 2px solid transparent;
    }

    button:disabled { opacity: .55; cursor: wait; }

    #status {
      min-height: 1.5em;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    #status[data-state="ok"] { color: var(--green); }
    #status[data-state="error"] { color: #ff7777; }

    #result {
      display: none;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: #050805;
      text-align: left;
      overflow-wrap: anywhere;
    }

    @media (min-width: 620px) {
      main { padding-top: 22px; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <h1>NC.OS · Freudenhund</h1>
      <span class="role">Erkennung</span>
    </div>

    <nav aria-label="Alpha-Lauf">
      <a class="case-link" href="0.html" aria-current="page" aria-label="Freudenhund">0</a>
      <a class="case-link" href="1.html" aria-label="RAM">1</a>
      <a class="case-link" href="2.html" aria-label="Steckkarten">2</a>
      <a class="case-link" href="3.html" aria-label="Kernel">3</a>
      <a class="case-link" href="4.html" aria-label="Industry Verified">4</a>
      <a class="case-link" href="5.html" aria-label="In-Ear Loader">5</a>
      <a class="case-link" href="6.html" aria-label="Letzter Tech">6</a>
      <a class="case-link" href="7.html" aria-label="11 zu 7">7</a>
      <a class="case-link" href="8.html" aria-label="Scanner">8</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Scanner-Eingang</h2>
      <p class="muted">Freudenhund · Erkennung</p>
    </section>

    <section class="card scanner" aria-labelledby="scan-title">
      <div class="scanner-icon" aria-hidden="true">⌖</div>
      <div>
        <h2 id="scan-title">Eingang prüfen</h2>
        <p class="muted">Text oder Kennung scannen und als Eingang erfassen.</p>
      </div>

      <label>
        <span class="muted">Eingabe</span><br>
        <input id="scan-input" type="text" autocomplete="off"
          placeholder="Text eingeben oder scannen"
          style="width:min(100%,420px);min-height:46px;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#050805;color:var(--text);font:inherit">
      </label>

      <button id="scan-button" type="button">Eingang erfassen</button>
      <p id="status" role="status" aria-live="polite">Bereit.</p>
      <pre id="result"></pre>
    </section>
  </main>

  <script>
    const input = document.querySelector("#scan-input");
    const button = document.querySelector("#scan-button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      const value = input.value.trim();

      if (!value) {
        status.textContent = "Bitte zuerst Text eingeben oder scannen.";
        status.dataset.state = "error";
        input.focus();
        return;
      }

      const record = {
        case: "0.html",
        name: "Freudenhund",
        rolle: "Erkennung",
        daten: "Scanner-Eingang",
        eingang: value,
        zeit: new Date().toLocaleString("de-DE")
      };

      result.textContent = JSON.stringify(record, null, 2);
      result.style.display = "block";
      status.textContent = "Eingang lokal erfasst.";
      status.dataset.state = "ok";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter") button.click();
    });
  </script>
</body>
</html>
