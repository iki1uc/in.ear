  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root {
  color-scheme: dark;
  --bg: #050505;
  --card: #111;
  --line: #333;
  --g: #00ff66;
  --y: #ffd166;
  --r: #ff5555;
  --b: #66ccff;
  --t: #f5f5f5;
  --m: #999;
  --panel: #0b1220;
  --muted: #8da294;
  --gold: #e8b64c;
  --green: #4ade80;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050505;
    --card: #111;
    --line: #333;
    --g: #00ff66;
    --y: #ffd166;
    --r: #ff5555;
    --b: #66ccff;
    --t: #f5f5f5;
    --m: #999;
    --panel: #0b1220;
    --muted: #8da294;
    --gold: #e8b64c;
    --green: #4ade80;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--t);
  font: 14px/1.5 Consolas, monospace;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #050505ee;
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--g);
  padding: 8px 12px;
  padding-top: max(8px, env(safe-area-inset-top));
}

h1 {
  margin: 0 0 6px;
  font-size: 16px;
  color: var(--g);
  letter-spacing: 2px;
  overflow-wrap: anywhere;
}

.steps {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  flex-wrap: nowrap;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

.steps button, .steps select {
  flex: 0 0 auto;
}

button, select {
  font: inherit;
  color: var(--t);
  background: #0b0b0b;
  border: 1px solid #444;
  border-radius: 8px;
  padding: 9px 12px;
  min-height: 44px;
  cursor: pointer;
  max-width: 100%;
}

button:hover:not(:disabled) {
  border-color: var(--g);
}

button:disabled {
  opacity: .3;
  cursor: not-allowed;
}

button.ok {
  border-color: var(--g);
  color: var(--g);
}

button.go {
  background: var(--g);
  color: #000;
  font-weight: 700;
  border-color: var(--g);
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 10px;
  min-width: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin: 0 0 10px;
  min-width: 0;
}

h2 {
  margin: 0 0 6px;
  font-size: 13px;
  color: var(--y);
  letter-spacing: 1px;
  overflow-wrap: anywhere;
}

.four {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px;
}

textarea {
  width: 100%;
  min-height: 110px;
  background: #000;
  color: var(--t);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  font: 12px/1.4 Consolas, monospace;
  resize: vertical;
}

.muted {
  color: var(--m);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.okc {
  color: var(--g);
}

.bad {
  color: var(--r);
}

.warn {
  color: var(--y);
}

pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
}

td, th {
  padding: 4px 6px;
  border-bottom: 1px solid #222;
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

th {
  color: var(--b);
}

.res {
  height: 260px;
  overflow: auto;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
}

#log {
  height: 160px;
  overflow: auto;
}

svg {
  display: block;
  max-width: 100%;
}

@media (max-width: 640px) {
  h1 {
    font-size: 14px;
    letter-spacing: 1px;
  }

  .steps button, .steps select {
    min-height: 44px;
    padding: 8px 10px;
  }

  button, select {
    min-height: 48px;
  }

  .steps button, .steps select {
    min-height: 44px;
  }

  main {
    padding: 8px;
  }

  .four {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }

  .card {
    padding: 10px;
    margin-bottom: 8px;
  }

  table {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .res {
    height: 220px;
  }
}
</style>
