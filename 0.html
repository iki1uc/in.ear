  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root{
  --bg:#09111b;
  --panel:#111e2c;
  --panel2:#0d1723;
  --line:#293c51;
  --line2:#3b536c;
  --text:#e5edf5;
  --muted:#9aacc0;
  --cyan:#70d9e7;
  --green:#83dca3;
  --gold:#f1c76c;
  --violet:#b388ff;
  --red:#ff858b;
  --orange:#ff9a3d;
  --turquoise:#4ae3c1;
  --blue:#5aa8ff;
  --white:#f2f7fb;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#09111b;
    --panel:#111e2c;
    --panel2:#0d1723;
    --line:#293c51;
    --text:#e5edf5;
    --muted:#9aacc0;
    --cyan:#70d9e7;
    --green:#83dca3;
    --gold:#f1c76c;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}

a,button,input,select,textarea{
  font:inherit
}

button,input,select,textarea{
  color:var(--text)
}

button{
  cursor:pointer
}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px;
  border-radius:6px
}

.panel{
  background:linear-gradient(145deg,#142236,#0d1723);
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  overflow-wrap:anywhere
}

.panel h2{
  margin:0 0 8px;
  font-size:18px;
  letter-spacing:.04em
}

.panel h3{
  margin:14px 0 8px;
  font-size:14px;
  color:var(--cyan);
  letter-spacing:.06em
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere
}

.kicker{
  color:var(--cyan);
  font-size:11px;
  letter-spacing:.22em;
  font-weight:800
}

.big{
  font-size:clamp(28px,7vw,42px);
  font-weight:800;
  line-height:1;
  overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums
}

.output{
  background:#07111b;
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
  min-height:52px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
  line-height:1.55
}

.input{
  width:100%;
  background:#091521;
  border:1px solid var(--line2);
  border-radius:9px;
  padding:10px;
  overflow-wrap:anywhere
}

select.input{
  -webkit-appearance:auto;
     -moz-appearance:auto;
          appearance:auto
}

.btn{
  background:#0b1724;
  border:1px solid var(--line2);
  border-radius:9px;
  padding:10px 12px;
  color:var(--text);
  text-align:center
}

.btn:hover{
  border-color:var(--cyan)
}

.btn.primary{
  background:#123549;
  border-color:#347d90;
  color:#e5fbff
}

.btn.gold{
  background:#2a2208;
  border-color:#8a6d1e;
  color:var(--gold)
}

.btn.danger{
  border-color:#74424b;
  color:#ffc2c5
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

.btn.active{
  border-color:var(--gold);
  background:#1d2b12;
  color:#fff;
  box-shadow:0 0 0 1px var(--gold) inset
}

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px
}

.grid-dash{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:16px;
  align-items:start
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--line);
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  overflow-wrap:anywhere
}

.bar{
  height:14px;
  border:1px solid var(--line2);
  border-radius:99px;
  overflow:hidden;
  background:#07111b
}

.bar > i{
  display:block;
  height:100%;
  background:var(--cyan);
  transition:width .3s
}

.bar-green > i{
  background:var(--green)
}

.bar-gold > i{
  background:var(--gold)
}

canvas{
  display:block;
  width:100%;
  height:auto;
  border:1px solid var(--line);
  border-radius:10px;
  background:#07111b
}

.tablewrap{
  overflow-x:auto
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

th,td{
  padding:8px;
  border-bottom:1px solid #ffffff12;
  text-align:left;
  overflow-wrap:anywhere
}

th{
  color:var(--cyan);
  font-size:12px;
  letter-spacing:.08em
}

.cell729{
  aspect-ratio:1;
  padding:2px;
  font-size:11px;
  border-radius:7px;
  border:1px solid var(--line);
  background:#091521;
  line-height:1.1
}

.cell729.current{
  background:var(--cyan);
  color:#07131b;
  font-weight:900;
  border-color:#fff
}

.cell729.neighbor{
  border-color:var(--cyan);
  color:var(--cyan)
}

.matrix-btn{
  padding:16px 8px;
  border-radius:10px;
  border:2px solid var(--line);
  text-align:center;
  font-weight:900;
  letter-spacing:.06em;
  background:#091521
}

.matrix-btn.active{
  transform:translateY(-1px);
  box-shadow:0 0 0 2px currentColor inset
}

.hy-field{
  aspect-ratio:1;
  border-radius:8px;
  border:1px solid var(--line);
  background:#091521;
  font-weight:800
}

.hy-field.sel{
  border-color:var(--green);
  color:var(--green);
  background:#39ff8818
}

.hy-field.center{
  border-color:var(--cyan);
  color:var(--cyan)
}

.log{
  max-height:190px;
  overflow:auto;
  white-space:pre-wrap;
  font-size:12px;
  line-height:1.6;
  color:var(--muted)
}

@media(max-width:560px){
  .panel{
    padding:13px
  }

  .grid-dash{
    grid-template-columns:1fr
  }

  table{
    font-size:12px
  }

  th,td{
    padding:6px 4px
  }
}
