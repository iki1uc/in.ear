<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alpha-Lauf</title>

  <style>
    :root {
      color-scheme: light dark;
      font: 16px/1.5 system-ui, sans-serif;
      --accent: #dfff35;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 { margin-bottom: 4px; }
    .muted { opacity: .7; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
    }

    input, button {
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid currentColor;
      border-radius: 8px;
      font: inherit;
    }

    input {
      flex: 1 1 240px;
      background: transparent;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    ol {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 12px;
      padding: 0;
      list-style: none;
    }

    .card {
      padding: 16px;
      border: 1px solid currentColor;
      border-radius: 10px;
    }

    .card h2 { margin: 0 0 8px; font-size: 1.1rem; }
    .status { margin-top: 12px; }
  </style>
</head>

<body>
  <main>
    <h1>Alpha-Lauf</h1>
    <p class="muted">Neun Schritte · filtern, prüfen und geordnet anzeigen</p>

    <div class="toolbar">
      <label>
        <span class="muted">Schritte filtern</span><br>
        <input id="search" type="search" placeholder="Name, Rolle oder Datei">
      </label>
      <button id="run" type="button">Lauf prüfen</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite">
      Bereit.
    </p>

    <ol id="steps"></ol>
  </main>

  <script>
    const steps = [
      { file: "0.html", name: "Freudenhund", role: "Erkennung", data: "Scanner-Eingang" },
      { file: "1.html", name: "RAM", role: "Brain", data: "ramdisk · 4168 MB/s" },
      { file: "2.html", name: "Steckkarten", role: "Noise", data: "SLI · 42%" },
      { file: "3.html", name: "Kernel", role: "Centrum", data: "MB1 · 9 CENTRUM" },
      { file: "4.html", name: "Industry Verified", role: "Mouth", data: "Abmachung" },
      { file: "5.html", name: "In-Ear Loader", role: "Orakel", data: "In-Ear" },
      { file: "6.html", name: "Letzter Tech", role: "Alt", data: "W3" },
      { file: "7.html", name: "11 zu 7", role: "SCSI", data: "7 Geräte" },
      { file: "8.html", name: "Scanner", role: "Eye", data: "1:1-Scan" }
    ];

    const list = document.querySelector("#steps");
    const search = document.querySelector("#search");
    const status = document.querySelector("#status");

    function render(query = "") {
      const term = query.trim().toLocaleLowerCase("de");
      const visible = steps.filter(step =>
        Object.values(step).some(value =>
          value.toLocaleLowerCase("de").includes(term)
        )
      );

      list.replaceChildren(...visible.map((step, index) => {
        const item = document.createElement("li");
        item.className = "card";

        const title = document.createElement("h2");
        title.textContent = `${step.file} · ${step.name}`;

        const details = document.createElement("p");
        details.textContent = `${step.role} · ${step.data}`;

        const order = document.createElement("p");
        order.className = "muted";
        order.textContent = `Schritt ${steps.indexOf(step) + 1} von ${steps.length}`;

        item.append(title, details, order);
        return item;
      }));

      status.textContent = `${visible.length} von ${steps.length} Schritten angezeigt.`;
    }

    search.addEventListener("input", () => render(search.value));

    document.querySelector("#run").addEventListener("click", () => {
      const files = steps.map(step => step.file);
      const hasDuplicates = new Set(files).size !== files.length;
      const isComplete = steps.every(step =>
        Object.values(step).every(value => value.trim() !== "")
      );

      if (hasDuplicates || !isComplete) {
        status.textContent = "Prüfung fehlgeschlagen: Einträge oder Dateinamen prüfen.";
        return;
      }

      status.textContent = `Prüfung erfolgreich: ${steps.length} Schritte, keine doppelten Dateien.`;
    });

    render();
  </script>
</body>
</html>
