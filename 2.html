  display: flex;
}

.grid{
  display: grid;
}

.overflow-x-clip{
  overflow-x: clip;
}

.border{
  border-width: 1px;
}

.pt-\[max\(1rem\2c var\(--safe-area-inset-top\)\)\]{
  padding-top: max(1rem,var(--safe-area-inset-top));
}

.filter{
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root {
  --bg: #f2efe6;
  --surface: #fffdf5;
  --surface-2: #171717;
  --ink: #131313;
  --muted: #5f5b52;
  --line: #131313;
  --line-soft: #cfc9ba;
  --accent: #e8ff2f;
  --green: #0d8a4b;
  --green-bg: #d7f5e3;
  --yellow: #b88900;
  --yellow-bg: #fff0a8;
  --blue: #175fd6;
  --blue-bg: #dbeaff;
  --grey: #66645f;
  --grey-bg: #e8e6e0;
  --red: #d92d20;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121210;
    --surface: #1c1c18;
    --surface-2: #f2efe6;
    --ink: #f2efe6;
    --muted: #bdb9ad;
    --line: #f2efe6;
    --line-soft: #4a4943;
    --accent: #e8ff2f;
    --green-bg: #123d28;
    --yellow-bg: #423a0f;
    --blue-bg: #162e56;
    --grey-bg: #2e2d29;
  }
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  -moz-text-size-adjust: 100%;
       text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'IBM Plex Mono', ui-monospace, monospace;
}

button, input {
  font: inherit;
}

button {
  touch-action: manipulation;
}

img {
  max-width: 100%;
}

pre {
  overflow-x: auto;
}

.font-display {
  font-family: 'Archivo', system-ui, sans-serif;
}

.card-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}

@media (min-width: 480px) {
  .card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (min-width: 900px) {
  .card-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

.tab-row {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 8px;
  padding-bottom: 4px;
  scrollbar-width: thin;
}

.tab-row::-webkit-scrollbar {
  height: 4px;
}

.btn {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 700;
  cursor: pointer;
  text-align: center;
}

.btn:active {
  transform: translate(1px, 1px);
}

.btn-primary {
  background: var(--ink);
  color: var(--bg);
}

.btn-accent {
  background: var(--accent);
  color: #131313;
}

.search-input {
  width: 100%;
  min-height: 52px;
  font-size: 16px;
  padding: 12px 14px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  outline: none;
}

.search-input:focus {
  box-shadow: 0 0 0 3px var(--accent);
}

.work-card {
  min-width: 0;
  overflow-wrap: anywhere;
  background: var(--surface);
  border: 2px solid var(--line);
  display: flex;
  flex-direction: column;
}
