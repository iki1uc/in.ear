}

.blur {
  --tw-blur: blur(8px);
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

.filter {
  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}

:root {
  color-scheme: dark;
  --bg: #050505;
  --card: #111111;
  --line: #333333;
  --green: #00ff66;
  --yellow: #ffd166;
  --red: #ff5555;
  --blue: #66ccff;
  --text: #f5f5f5;
  --muted: #999999;
  --surface: #050505;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

body {
  font: 15px/1.5 Consolas, monospace;
  padding-bottom: env(safe-area-inset-bottom);
  overflow-x: clip;
}

button, input, select {
  font: inherit;
  color: var(--text);
  background: #0b0b0b;
  border: 1px solid #444;
  border-radius: 8px;
  padding: 10px 12px;
  min-height: 48px;
}

button {
  cursor: pointer;
  white-space: nowrap;
}

button:hover:not(:disabled) {
  border-color: var(--green);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

button.on {
  background: var(--green);
  color: #000;
  border-color: var(--green);
  font-weight: 700;
  box-shadow: 0 0 0 2px #050505, 0 0 0 4px var(--green);
}

button.halt {
  border-color: var(--red);
  color: var(--red);
}

button.halt.set {
  background: var(--red);
  color: #000;
}

input, select {
  width: 100%;
}

label {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
}

:focus-visible {
  outline: 3px solid var(--green);
  outline-offset: 2px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  margin: 0 0 12px;
  min-width: 0;
}

.card h2 {
  margin: 0 0 8px;
  font-size: 16px;
  color: var(--yellow);
  letter-spacing: 1px;
}

.muted {
  color: var(--muted);
}

.ok {
  color: var(--green);
}

.bad {
  color: var(--red);
}

.warn {
  color: var(--yellow);
}

.out {
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 13px;
}

.pipe {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.stage {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.stage.done {
  border-color: var(--green);
  color: var(--green);
}

.stage b {
  display: block;
  font-size: 20px;
}

.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 8px 0;
}

.kpis {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.kpi {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
}

.kpi b {
  display: block;
  font-size: 24px;
  color: var(--blue);
  overflow-wrap: anywhere;
}

.two {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}

.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 6px 0;
}

.chip {
  padding: 4px 10px;
  min-height: 36px;
}

button.on2 {
  border-color: var(--green);
  color: var(--green);
}

.log {
  height: 210px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

td, th {
  padding: 6px;
  border-bottom: 1px solid #222;
  text-align: left;
  overflow-wrap: anywhere;
  vertical-align: top;
}

th {
  color: var(--blue);
}

.tabs {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-wrap: nowrap;
  padding-bottom: 3px;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tabs button {
  flex: 0 0 auto;
  min-height: 44px;
  padding: 8px 12px;
}

.tabs button.on {
  position: relative;
}

.tabs button.on::after {
  content: "";
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 3px;
  height: 3px;
  background: #000;
  border-radius: 2px;
}

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 72px);
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}

.dpad button {
  min-height: 64px;
  min-width: 72px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  line-height: 1.1;
  padding: 6px 4px;
  white-space: normal;
}

.dpad button .arrow {
  font-size: 20px;
  line-height: 1;
}

.dpad button .dlabel {
  font-size: 10px;
  letter-spacing: .5px;
  color: var(--muted);
}

.dpad button:hover .dlabel, .dpad button:focus-visible .dlabel {
  color: var(--text);
}

canvas#net {
  width: 100%;
  height: auto;
  display: block;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  touch-action: manipulation;
}

.grid-wrap {
  width: 100%;
  max-width: 520px;
  margin: 12px auto 6px;
  touch-action: none;
}

#gridCanvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}

.view {
  display: none;
}

.view.on {
  display: block;
}

.checklist {
  list-style: none;
  margin: 8px 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.checklist li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  overflow-wrap: anywhere;
}

.checklist .mark {
  font-weight: 800;
  flex: 0 0 22px;
  text-align: center;
}

.bar {
  height: 14px;
  background: #000;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.bar > div {
  height: 100%;
  background: var(--green);
  transition: width .2s ease;
}

.heat-legend {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 6px 0 4px;
  font-size: 12px;
}

.heat-legend .sw {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 9px;
  background: #000;
}

.dot {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  flex: 0 0 14px;
}

.history {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.history li {
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  overflow-wrap: anywhere;
  font-size: 13px;
}

.vec-lines {
  display: grid;
  gap: 6px;
}

.vec-lines > div {
  background: #000;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  overflow-wrap: anywhere;
}

.vec-lines b {
  color: var(--yellow);
}

.approval {
  display: flex !important;
  gap: 10px;
  align-items: center;
  color: var(--text) !important;
  margin: 0 !important;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: #0b0b0b;
  min-height: 56px;
  font-size: 14px;
}

.approval input {
  width: 30px !important;
  height: 30px;
  min-height: 30px;
  accent-color: var(--green);
  flex: 0 0 30px;
}

.hint {
  font-size: 12px;
  color: var(--muted);
  margin: 4px 0;
}

@media (max-width: 640px) {
  h1 {
    font-size: 14px !important;
    letter-spacing: 1px !important;
  }

  button, select, input {
    min-height: 48px;
  }

  .pipe {
    grid-template-columns: repeat(2, 1fr);
  }

  .kpis {
    grid-template-columns: 1fr;
  }

  main {
    padding: 8px !important;
  }

  .card {
    padding: 10px;
    margin-bottom: 8px;
  }

  .dpad {
    grid-template-columns: repeat(3, 72px);
  }

  .tabs button {
    padding: 8px 10px;
  }
}
