}

  border-bottom:1px solid var(--green);
  padding:8px 10px;
  font-weight:800;
  letter-spacing:.08em;
  font-size:12px;
}

.btn{
  border:1px solid var(--green);
  background:#000;
  color:var(--green);
  padding:8px 12px;
  font-weight:800;
  letter-spacing:.06em;
  font-size:12px;
}

.btn:hover{
  background:var(--green);
  color:#000;
}

.btn.active{
  background:var(--green);
  color:#000;
}

.btn.gold{

  color:var(--gold);
}

  background:var(--gold);
  color:#000;
}

.btn.cyan{

  color:var(--cyan);
}

.btn.cyan:hover, .btn.cyan.active{
  background:var(--cyan);
  color:#000;
}

.btn.danger{
  border-color:var(--red);
  color:var(--red);
}

.btn.danger:hover{
  background:var(--red);
  color:#000;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.chip{

  padding:3px 6px;
  font-size:11px;
}

  width:100%;
  min-height:260px;
  background:#000;
  color:var(--green);

  resize:vertical;
}

.log-scroll{
  max-height:220px;
  overflow-y:auto;

.node{

  font-size:12px;

.node:hover{

}

.node.partner{

.cell{

  border-radius:3px;
  cursor:pointer;
  position:relative;
  transition:transform .15s;
  display:grid;
  place-items:center;

.cell:hover{
  transform:scale(1.5);
  z-index:5;
  box-shadow:0 0 14px currentColor;
}

.cell.sel{
  outline:2px solid #fff;
  transform:scale(1.5);
  z-index:6;
}

.cell.sel2{
  outline:2px solid var(--pink);
  transform:scale(1.5);
  z-index:6;
  box-shadow:0 0 18px var(--pink);
}

.cell.nbr{
  outline:1px dashed var(--gold);
  box-shadow:0 0 10px var(--gold);
}

.cell.path{
  outline:1px solid var(--cyan);
  box-shadow:0 0 10px var(--cyan);
}

.cell.dim{
  opacity:.12;
