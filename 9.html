<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Ghosts · 3× Root</title>
<style>
:root{color-scheme:dark;--bg:#080d14;--panel:#101925;--line:#263547;--text:#d8e2ee;--muted:#8293a8;--gold:#f0c674;--green:#58dda0;--blue:#69c9dc;--violet:#b49af5;--red:#ff7883}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 system-ui,sans-serif}
button,input{font:inherit}
button{border:1px solid var(--line);background:#162231;color:var(--text);padding:7px 10px;border-radius:6px;cursor:pointer}
button:hover,button.active{border-color:var(--gold);color:var(--gold)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100dvh;min-height:520px;display:grid;grid-template-rows:auto 1fr auto}
header,footer,.toolbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0d1520;border-bottom:1px solid var(--line)}
header strong{color:var(--gold);letter-spacing:.04em}
main{min-height:0;display:grid;grid-template-columns:220px minmax(280px,1fr) 280px}
aside{overflow:auto;padding:12px;background:var(--panel)}
aside:first-child{border-right:1px solid var(--line)}
aside:last-child{border-left:1px solid var(--line)}
.board{position:relative;display:grid;place-items:center;min-width:0;min-height:0;padding:12px}
canvas{display:block;width:min(100%,calc(100dvh - 180px));height:auto;max-height:100%;aspect-ratio:1;background:#080d14;border-radius:8px}
.card{padding:11px;margin-bottom:10px;background:#121e2b;border:1px solid var(--line);border-radius:8px}
h2{margin:0 0 9px;font-size:12px;color:var(--green);letter-spacing:.08em}
.list{display:grid;gap:5px}
.item{padding:8px;text-align:left}
.item.selected{border-color:var(--gold);background:#302819}
.item small,.muted{color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
.row label{color:var(--muted)}
input[type=range]{width:110px;accent-color:var(--gold)}
.toolbar{flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:0}
.toolbar .spacer{flex:1}
footer{justify-content:center;border-top:1px solid var(--line);border-bottom:0;color:var(--muted);font-size:11px}
#log{max-height:150px;overflow:auto;color:var(--muted);font-size:11px}
#log div{padding:2px 0;border-bottom:1px solid #ffffff0a}
.center-label{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;text-shadow:0 1px 5px #000}
#title{top:20px;color:var(--gold);font-size:20px}
#moveLabel{bottom:20px;color:var(--green)}
@media(max-width:900px){main{grid-template-columns:190px minmax(240px,1fr)}aside.details{display:none}}
@media(max-width:620px){.app{height:auto;min-height:100dvh;grid-template-rows:auto 1fr auto}main{grid-template-columns:1fr}.chapters{display:none}.board{min-height:65vw}canvas{width:min(92vw,65vh)}aside.details{display:block;border:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
<header><strong>♟ CHESS GHOSTS</strong><span class="muted">Partien · Zugverlauf · Root-Filter</span><span class="spacer"></span><span id="status" class="muted" aria-live="polite"></span></header>

<main>
<aside class="chapters">
<section class="card"><h2>PARTIEN</h2><div id="parties" class="list"></div></section>
<section class="card"><h2>FILTER</h2><div id="repoList" class="list"></div></section>
</aside>

<section class="board" aria-label="Schachbrett-Visualisierung">
<canvas id="board" aria-label="Visualisierung des aktuellen Zuges"></canvas>
<div id="title" class="center-label"></div>
<div id="moveLabel" class="center-label"></div>
</section>

<aside class="details">
<section class="card"><h2>AKTUELLER ZUG</h2><div id="moveDetail">—</div></section>
<section class="card">
<h2>ANSICHT</h2>
<div class="row"><label for="depth">Root-Tiefe</label><input id="depth" type="range" min="1" max="3" value="2"><b id="depthValue">2</b></div>
<div class="row"><label for="tempo">Tempo</label><input id="tempo" type="range" min="1" max="10" value="4"><b id="tempoValue">4</b></div>
<div class="row"><label><input id="trail" type="checkbox" checked> Zugspur</label><label><input id="glow" type="checkbox" checked> Leuchten</label></div>
</section>
<section class="card"><h2>ZUGARTEN</h2><div id="stats"></div></section>
<section class="card"><h2>LOG</h2><div id="log" aria-live="polite"></div></section>
</aside>
</main>

<nav class="toolbar" aria-label="Wiedergabe">
<button id="play">Pause</button><button id="back">Zurück</button><button id="step">Weiter</button>
<button id="prev">Vorige Partie</button><button id="next">Nächste Partie</button>
<span class="spacer"></span><a href="https://github.com/iki1uc" target="_blank" rel="noopener noreferrer">GitHub</a>
</nav>
<footer>Interaktive Visualisierung · Die Züge werden als Koordinatenpfade dargestellt.</footer>
</div>

<script>
"use strict";

const rawParties=[
 ["Die Unsterbliche",1949,"Remis","e2b3 f4h4 b1e2 a6f4 h3g2 g3c3 a2f5 d1e6 b6d4 g6g5 h7a4 b7g1 d6b7 a4h8 h6g4 h5g2"],
 ["Opernpartie",1941,"Schwarz","f3f4 h6e5 g1b2 c1c5 c6c1 a8f4 e6b5 f1f4 d3h6 a1a8 d8g3 c6h6 b1b1 h1c4 h2f3 g5d5 f2c1 d7g5"],
 ["Evergreen",1932,"Schwarz","b8f2 c6f7 c7c5 c1h3 b3a4 e7c3 d7b2 f3h1 h2h5 f6c6 g2b5 a1b7 d6b3 d2h4"],
 ["Match des Jahrhunderts",1889,"Remis","a6h4 e6h5 b1b3 a6g8 a7f2 a5g4 g3a4 c2d5 e8a6 a7c4 f4h6 d3g7 f1b5 e3d2 d8g5 a2h6"],
 ["Kasparov vs. Deep Blue",1997,"Weiß","d4g5 d2b8 g5f4 h1f4 a8c8 h4d7 g5g7 e5h1 f3c8 a6d3 g4d4 h2d1 g6d7 d4e1 e5h3 d5h2 c7a2 b3e1 f3g1 a3c1 g1h1 g2d1 b1b6 g1d1"],
 ["Schäferzug",1924,"Schwarz","h7f7 e7g5 c4c8 b1h5 e2g1 f4g1 f7f6 b7f2 d7g6 e6b5 b8h1 b5d1 d3c3 f3d1"]
];

const parties=rawParties.map(([name,year,result,line])=>({
 name,year,result,
 moves:line.trim().split(/\s+/).map(token=>({from:token.slice(0,2),to:token.slice(2,4)}))
}));

const repos=[
 {name:"iki1uc",type:1,value:360,ram:128,gpu:5},
 {name:"SYS",type:1,value:120,ram:256,gpu:8},
 {name:"TEM",type:1,value:90,ram:180,gpu:6},
 {name:"ID",type:1,value:80,ram:90,gpu:3},
 {name:"OP",type:1,value:70,ram:120,gpu:4},
 {name:"3hit90",type:2,value:900,ram:1200,gpu:32},
 {name:"re (Borg)",type:2,value:450,ram:800,gpu:28},
 {name:"hdf",type:3,value:756,ram:1500,gpu:45},
 {name:"RESPO.ai",type:3,value:819,ram:2000,gpu:60},
 {name:"SETUP",type:2,value:240,ram:600,gpu:18}
];

const $=id=>document.getElementById(id);
const colors={Springer:"#ffad60",Diagonal:"#69c9dc",Gerade:"#58dda0",Stillstand:"#b49af5",Sonstige:"#ff7883"};
let partyIndex=0,moveIndex=0,playing=true,depth=2,selectedRepo=0,lastTime=0,progress=0;
let counts={};
const canvas=$("board"),ctx=canvas.getContext("2d");

function classify(from,to){
 const dx=Math.abs(to.charCodeAt(0)-from.charCodeAt(0));
 const dy=Math.abs(Number(to[1])-Number(from[1]));
 if(dx===0&&dy===0)return "Stillstand";
 if((dx===1&&dy===2)||(dx===2&&dy===1))return "Springer";
 if(dx===dy)return "Diagonal";
 if(dx===0||dy===0)return "Gerade";
 return "Sonstige";
}
function resetCounts(){counts={Springer:0,Diagonal:0,Gerade:0,Stillstand:0,Sonstige:0};}
function log(message){
 const line=document.createElement("div");
 line.textContent=`${new Date().toLocaleTimeString("de-DE")} · ${message}`;
 $("log").prepend(line);
 while($("log").children.length>30)$("log").lastElementChild.remove();
}
function visibleRepos(){return repos.filter(r=>depth===1?r.type===1:depth===2?r.type<3:true);}
function repoScore(repo){return Math.max(1,Math.floor(repo.value/Math.max(.3,repo.ram/1000)/Math.max(.3,repo.gpu/100)));}
function render(){
 const party=parties[partyIndex];
 $("parties").replaceChildren(...parties.map((p,i)=>{
  const b=document.createElement("button"); b.className="item"+(i===partyIndex?" selected":"");
  b.textContent=`${p.name} · ${p.year}`; b.onclick=()=>selectParty(i); return b;
 }));
 const visible=visibleRepos();
 $("repoList").replaceChildren(...visible.map(repo=>{
  const i=repos.indexOf(repo),b=document.createElement("button");
  b.className="item"+(i===selectedRepo?" selected":"");
  b.textContent=`${repo.name} · Ebene ${repo.type}`; b.onclick=()=>{selectedRepo=i;render();};return b;
 }));
 const move=party.moves[moveIndex];
 $("title").textContent=party.name;
 $("moveLabel").textContent=move?`${move.from} → ${move.to}`:"Partie beendet";
 $("moveDetail").textContent=move?`${classify(move.from,move.to)} · Zug ${moveIndex+1} von ${party.moves.length}`:"Keine weiteren Züge";
 $("status").textContent=`Partie ${partyIndex+1}/${parties.length} · Zug ${moveIndex}/${party.moves.length}`;
 $("depth").value=depth;$("depthValue").textContent=depth;
 $("stats").innerHTML=Object.entries(counts).map(([name,n])=>`<div class="row"><span>${name}</span><b>${n}</b></div>`).join("");
 draw();
}
function selectParty(i){partyIndex=i;moveIndex=0;progress=0;resetCounts();render();log(`Partie gewählt: ${parties[i].name}`);}
function advance(){
 const move=parties[partyIndex].moves[moveIndex];
 if(!move){playing=false;$("play").textContent="Abspielen";return;}
 counts[classify(move.from,move.to)]++;
 moveIndex++;progress=0;
 if(moveIndex>=parties[partyIndex].moves.length&&partyIndex<parties.length-1){partyIndex++;moveIndex=0;resetCounts();}
 render();
}
function back(){
 if(moveIndex>0){moveIndex--;counts[classify(parties[partyIndex].moves[moveIndex].from,parties[partyIndex].moves[moveIndex].to)]--;}
 else if(partyIndex>0){partyIndex--;moveIndex=parties[partyIndex].moves.length;resetCounts();for(const m of parties[partyIndex].moves)counts[classify(m.from,m.to)]++;}
 progress=0;render();
}
function square(name,size){return{x:(name.charCodeAt(0)-97)*size+size/2,y:(8-Number(name[1]))*size+size/2};}
function draw(){
 const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 const size=Math.max(1,Math.floor(Math.min(rect.width,rect.height)));
 if(canvas.width!==Math.floor(size*dpr)||canvas.height!==Math.floor(size*dpr)){canvas.width=size*dpr;canvas.height=size*dpr;}
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const cell=size/8;ctx.clearRect(0,0,size,size);
 for(let y=0;y<8;y++)for(let x=0;x<8;x++){ctx.fillStyle=(x+y)%2?"#0b1420":"#142333";ctx.fillRect(x*cell,y*cell,cell,cell);}
 ctx.strokeStyle="#d39d55";ctx.strokeRect(0,0,size,size);
 const p=parties[partyIndex];
 if($("trail").checked)for(let i=0;i<moveIndex;i++){const m=p.moves[i],a=square(m.from,cell),b=square(m.to,cell);ctx.globalAlpha=.35;ctx.strokeStyle=colors[classify(m.from,m.to)];ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
 ctx.globalAlpha=1;
 if(depth>=2){ctx.strokeStyle="#69c9dc55";ctx.lineWidth=1;for(let i=1;i<9;i++){ctx.beginPath();ctx.moveTo(i*size/9,0);ctx.lineTo(i*size/9,size);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*size/9);ctx.lineTo(size,i*size/9);ctx.stroke();}}
 if(depth>=3){ctx.strokeStyle="#b49af577";ctx.beginPath();ctx.arc(size/2,size/2,size*.46,0,Math.PI*2);ctx.stroke();}
 const m=p.moves[moveIndex];if(m){const a=square(m.from,cell),b=square(m.to,cell),x=a.x+(b.x-a.x)*progress,y=a.y+(b.y-a.y)*progress;
  ctx.strokeStyle="#f0c674";ctx.lineWidth=2;ctx.strokeRect(Math.floor(a.x/cell)*cell+2,Math.floor(a.y/cell)*cell+2,cell-4,cell-4);
  if($("glow").checked){const g=ctx.createRadialGradient(x,y,0,x,y,cell*.7);g.addColorStop(0,colors[classify(m.from,m.to)]+"aa");g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.fillRect(x-cell,y-cell,cell*2,cell*2);}
  ctx.fillStyle="#fff";ctx.font=`${cell*.55}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("♟",x,y);
 }
}
function loop(now){
 const dt=Math.min(50,now-lastTime||16);lastTime=now;
 if(playing){const duration=1200-Number($("tempo").value)*100;progress+=dt/duration;if(progress>=1)advance();else draw();}
 requestAnimationFrame(loop);
}
$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"Pause":"Abspielen";};
$("step").onclick=()=>{playing=false;$("play").textContent="Abspielen";advance();};
$("back").onclick=()=>{playing=false;$("play").textContent="Abspielen";back();};
$("prev").onclick=()=>selectParty(Math.max(0,partyIndex-1));
$("next").onclick=()=>selectParty(Math.min(parties.length-1,partyIndex+1));
$("depth").oninput=e=>{depth=Number(e.target.value);render();};
$("tempo").oninput=e=>$("tempoValue").textContent=e.target.value;
window.addEventListener("resize",draw);
resetCounts();render();log("Visualisierung bereit.");requestAnimationFrame(loop);
</script>
</body>
</html>
