.flex-wrap {

}

.items-center {

}

.justify-center {

}

.justify-between {

}

.gap-3 {

}

.gap-4 {

}

.space-y-1 > :not([hidden]) ~ :not([hidden]) {

.border-2 {

}

.border-b {

}

.border-t {

}

.border-\[var\(--amber\)\] {
  border-color: var(--amber);
}

.border-\[var\(--green\)\] {
  border-color: var(--green);
}

.border-\[var\(--green-dim\)\] {
  border-color: var(--green-dim);
}

.bg-black {
  --tw-bg-opacity: 1;
  background-color: rgb(0 0 0 / var(--tw-bg-opacity, 1));
}

.p-3 {

.tracking-widest {
  letter-spacing: 0.1em;
}

.text-\[var\(--amber\)\] {
  color: var(--amber);

.text-\[var\(--muted\)\] {

.filter {

.\[overflow-wrap\:anywhere\] {

:root {
  --bg: #000000;
  --surface: #010801;
  --surface2: #021202;
  --green: #00ff00;
  --green-dim: #00aa00;
  --green-faint: #003300;
  --text: #00ff00;
  --muted: #7dff7d;
  --red: #ff2b2b;
  --amber: #ffcc00;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --surface: #010801;
  }
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

button, textarea, select, input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.panel {
  border: 1px solid var(--green);
  background: var(--surface);
}

.panel-title {
  border-bottom: 1px solid var(--green);
  padding: 8px 10px;
  font-weight: 800;
  letter-spacing: .08em;
  font-size: 12px;
}

.btn {
  border: 1px solid var(--green);
  background: #000;
  color: var(--green);
  padding: 8px 12px;
  font-weight: 800;
  letter-spacing: .06em;
  font-size: 12px;
}

.btn:hover {
  background: var(--green);
  color: #000;
}

.btn.active {
  background: var(--green);
  color: #000;
}

.btn.danger {
  border-color: var(--red);
  color: var(--red);
}

.btn.danger:hover {
  background: var(--red);
  color: #000;
}

.chip {
  border: 1px solid var(--green-dim);
  padding: 3px 6px;
  font-size: 11px;
}

.log-scroll {
  max-height: 260px;
  overflow-y: auto;
}

.node {
  border: 1px solid var(--green);
  background: #000;
  color: var(--green);
  padding: 10px 8px;
  font-weight: 800;
  font-size: 12px;
  text-align: center;
}

.node:hover {
  background: var(--green);
  color: #000;
}

.node.sel {
  background: var(--green);
  color: #000;
  box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--green);
}

select.code-select {
  width: 100%;
  background: #000;
  color: var(--green);
  border: 1px solid var(--green-dim);
  padding: 10px;
  font-size: 12px;
}

.hover\:underline:hover {
  text-decoration-line: underline;
}

@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:p-4 {
    padding: 1rem;
  }

  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
}

@media (min-width: 768px) {
  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
